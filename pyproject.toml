[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotics-ai"
version = "0.1.0"
description = "Robotics for AI Engineers - executable robotics curriculum for ML and data engineers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pyyaml>=6.0",
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "matplotlib>=3.8",
]
docs = [
    "mkdocs-material>=9.5",
]

[tool.setuptools.packages.find]
include = ["robotics_ai*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
# Rigid-body math uses capitalized matrix names (R, T, T_parent_child) by
# convention; suppressing pep8-naming's argument/variable case rules keeps
# code aligned with the notation used in the lessons.
ignore = ["N802", "N803", "N806"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
