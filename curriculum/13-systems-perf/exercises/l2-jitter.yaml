id: sys-l2-jitter
title: "Fast on average, late on purpose"
lesson: modules/13-systems-perf/02-real-time
description: >-
  Three implementations of the same 100 Hz control step, each measured for
  twenty seconds. One has the best mean AND the best p99 and misses its
  deadline every 1.7 seconds. Work out which one you ship, and what metric
  would have told you without running this exercise.
setup_code: |
  import numpy as np

  HZ = 100.0
  DEADLINE_MS = 10.0
  N = 2000                      # 20 s at 100 Hz

  _rng = np.random.default_rng(2)

  # A — allocates in the hot path. Almost always fast; occasionally the
  # allocator takes a slow path and the frame stops for tens of ms.
  _A = 4.2 + 0.25 * _rng.standard_normal(N)
  _A = _A + (_rng.random(N) < 0.006) * (12.0 + 13.0 * _rng.random(N))

  # B — fixed-capacity buffers, nothing allocated after startup. Slower,
  # and boring.
  _B = 6.2 + 0.18 * _rng.standard_normal(N)

  # C — fast, sharing a core with a background job that wakes up
  # periodically and preempts it.
  _C = 4.4 + 0.22 * _rng.standard_normal(N)
  for _s in range(180, N, 200):
      _n = min(6, N - _s)
      _C[_s:_s + _n] += 9.0 + 3.0 * _rng.random(_n)

  TRACES = {"A-allocating": _A, "B-preallocated": _B, "C-preempted": _C}
