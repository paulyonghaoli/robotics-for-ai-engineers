id: sys-l3-hotpath
title: "Which stages are worth porting"
lesson: modules/13-systems-perf/03-hot-path
description: >-
  A perception-and-control loop in Python: five stages, 6.54 ms per frame,
  and a 3.5 ms slice of the budget to fit into. You have time to port some of
  it to C++. Work out which stages, what the ceiling is, and why the two
  obvious ways of ranking the candidates both pick a stage worth nothing.
setup_code: |
  # What a port actually changes.
  #
  # Time inside a vectorized kernel is ALREADY compiled C — NumPy, BLAS,
  # OpenCV. Porting it changes nothing, and `vector_ms` is therefore
  # identical in both columns.
  #
  # What the port removes is per-call interpreter dispatch and per-element
  # interpreter overhead, which is where a Python loop spends its life.
  PY_CALL_US = 1.2       # a Python-level call plus NumPy argument dispatch
  CPP_CALL_US = 0.02     # an inlined C++ call
  PY_ELEM_NS = 75.0      # one iteration of a Python loop body
  CPP_ELEM_NS = 1.5      # one iteration of the same loop in C++

  # (vector_ms, calls_per_frame, python_loop_iterations_per_frame)
  STAGES = {
      "undistort": (2.00,   1,     0),      # one big OpenCV call
      "cluster":   (0.05,  12, 40000),      # a Python loop over point pairs
      "associate": (0.02, 240,     0),      # many small calls
      "solve":     (1.15,   1,     0),      # one LAPACK call
      "control":   (0.00,  12,    40),      # a handful of scalar operations
  }

  # This pipeline's slice of a 200 Hz frame; the rest of the 5 ms goes to
  # the planner, the drivers and the middleware.
  BUDGET_MS = 3.5
starter_code: |
