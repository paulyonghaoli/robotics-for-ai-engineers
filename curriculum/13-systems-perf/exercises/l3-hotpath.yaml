  def frame_ms(ported=frozenset()):
      """Total frame time with `ported` (a set of stage names) in C++ and
      everything else still in Python."""
      # TODO
      return 1.0

  def ceiling():
      """Best possible speedup: the whole loop ported."""
      # TODO
      return 1.0

  def port_order():
      """Stage names, best candidate first."""
      # TODO
      return list(STAGES)

  def minimal_ports(target_ms):
      """The smallest set of stages that gets the frame under `target_ms`,
      taking them in port_order(). Return None if no set can."""
      # TODO
