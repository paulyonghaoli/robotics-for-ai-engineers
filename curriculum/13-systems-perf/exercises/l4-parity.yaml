id: sys-l4-parity
title: "The parity suite that passed"
lesson: modules/13-systems-perf/04-porting-parity
description: >-
  A steering function has been ported. You have the Python reference, the
  port, two hundred fixtures, and a tolerance somebody picked. The suite is
  green. Build the harness properly and find the three ways it was green
  without the port being correct.
setup_code: |
  import math
  import numpy as np

  K_P = 1.5
  MAX_STEER = 2.0

  def wrap(a):
      return (a + math.pi) % (2 * math.pi) - math.pi

  CURV = np.array([0.010, 0.020, 0.015, 0.012, 0.018, 0.011, 0.014, 0.016])

  def ref_steer(heading_err, curvatures):
      """The Python reference. Verified, boring, slow."""
      k = float(np.mean(curvatures)) if len(curvatures) else 0.0
      s = K_P * wrap(heading_err) + k
      return max(-MAX_STEER, min(MAX_STEER, s))

  def port_steer(heading_err, curvatures):
      """Stand-in for the C++ port, written in Python so it runs here.
      Three things about it differ from the reference. None of them is a
      typo, and all three are mistakes people actually make."""
      with np.errstate(all="ignore"):
          k = float(np.sum(curvatures) / np.float64(len(curvatures)))
      s = np.float32(K_P) * np.float32(wrap(heading_err)) + np.float32(k)
      if s > MAX_STEER:
          s = np.float32(MAX_STEER)
      return float(s)

  _rng = np.random.default_rng(11)

  # The fixture suite that shipped with the port: two hundred cases drawn
  # from "normal driving".
  NOMINAL = [(float(e), CURV) for e in _rng.uniform(-1.0, 1.0, 200)]

  # The range the robot actually operates over, including reversing.
  FIELD = [(float(e), CURV) for e in _rng.uniform(-math.pi, math.pi, 200)]

  # The cases nobody wrote down.
  EDGE = [
      (0.3, np.array([])),          # no path points
      (0.3, CURV[:1]),              # one path point
      (math.pi, CURV),              # goal directly behind
      (-math.pi, CURV),
  ]

  SHIPPED_TOL = 1e-3               # the tolerance the port was signed off with
