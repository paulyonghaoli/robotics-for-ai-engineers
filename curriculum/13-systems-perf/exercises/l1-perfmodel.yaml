id: sys-l1-perfmodel
title: "Where the frame time actually goes"
lesson: modules/13-systems-perf/01-performance-model
description: >-
  The same policy runs at 220 fps on the workstation and 62 fps on the
  robot. The obvious explanation is that the robot's GPU is smaller. Build
  the latency model, find out what fraction of the frame the GPU is
  responsible for, and check what a faster one would buy you.
setup_code: |
  # A small visuomotor policy: convolutional trunk, transformer head,
  # action MLP. Measured at batch 1, which is the only batch size a robot
  # ever runs.
  #
  # `bytes` is the total memory traffic for ONE inference — weights read
  # once plus activations written and read back. At batch 1 the weights
  # dominate, and they are re-read every single frame.
  MODEL = {
      "name": "visuomotor-policy",
      "ops": 72,                # kernels launched per inference
      "flops": 2.1e9,
      "bytes": 80e6,
      "input_bytes": 2.0e6,     # two camera frames plus proprioception
  }

  # achieved_frac: the fraction of theoretical peak that batch-1 kernels
  # actually reach. It is measured, not derived — small kernels do not fill
  # the machine. 0.35 is typical and generous.
  #
  # dispatch_us_per_op: CPU time to launch one kernel from an eager
  # framework. This is a property of the HOST, not the accelerator.
  DEVICES = {
      "workstation-A100": {
          "peak_flops": 312e12,          # BF16 dense
          "bandwidth_bps": 1555e9,       # HBM2e
          "achieved_frac": 0.35,
          "dispatch_us_per_op": 60.0,    # server CPU, eager framework
          "graph_launch_us": 5.0,        # whole graph, one launch
          "link_bps": 25e9,              # PCIe 4.0 x16, achieved
      },
      "robot-AGX-Orin": {
          "peak_flops": 68.75e12,        # FP16 dense
          "bandwidth_bps": 204.8e9,      # LPDDR5
          "achieved_frac": 0.35,
          "dispatch_us_per_op": 210.0,   # embedded CPU, same framework
          "graph_launch_us": 20.0,
          "link_bps": None,              # unified memory: no copy at all
      },
  }
