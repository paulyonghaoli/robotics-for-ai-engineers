id: map-l3-ekf-slam
title: "EKF-SLAM: watch correlations do the work"
lesson: modules/04-mapping/03-ekf-slam
description: >-
  A minimal joint-state SLAM: robot position (known heading, for clarity)
  plus TWO landmarks in one 6-D state with full covariance. You implement
  the joint update; the tests then verify the lesson's central claims —
  observing landmark A shrinks landmark B's uncertainty (through the
  correlations), and absolute uncertainty never drops below the initial
  pose uncertainty.
setup_code: |
  import numpy as np

  RNG = np.random.default_rng(8)
  LM_TRUE = np.array([[4.0, 6.0], [8.0, 2.0]])
  R_MEAS = np.eye(2) * 0.09          # per-landmark (x,y)-offset measurement noise
  Q_STEP = np.eye(2) * 0.02          # robot motion noise per step

  def simulate(steps=40):
      """Robot walks +x 0.5/step; observes lm 0 on even, lm 1 on odd steps.
      Observation = landmark position MINUS robot position + noise."""
      robot = np.array([0.0, 4.0])
      obs = []
      for k in range(steps):
          robot = robot + [0.5, 0.0] + RNG.multivariate_normal([0, 0], Q_STEP)
          lm = k % 2
          z = LM_TRUE[lm] - robot + RNG.multivariate_normal([0, 0], R_MEAS)
          obs.append((lm, z, robot.copy()))
      return obs
