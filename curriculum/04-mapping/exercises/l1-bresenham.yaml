id: map-l1-bresenham
title: "Bresenham: walking the beam"
lesson: modules/04-mapping/01-occupancy-grids
description: >-
  Implement Bresenham's line traversal — the 1965 raster algorithm inside
  every occupancy mapper, enumerating exactly the grid cells a lidar beam
  passes through, integer arithmetic only.
setup_code: |
  import numpy as np
starter_code: |
  import numpy as np

  def bresenham(y0, x0, y1, x1):
      """All integer cells from (y0,x0) to (y1,x1), inclusive, in order."""
      # TODO: classic error-accumulator form — see hints
      return [(y0, x0)]

  print(bresenham(0, 0, 2, 5))
tests: |
  import numpy as np
  assert bresenham(0, 0, 0, 3) == [(0,0), (0,1), (0,2), (0,3)], "horizontal line"
  assert bresenham(0, 0, 3, 0) == [(0,0), (1,0), (2,0), (3,0)], "vertical line"
  assert bresenham(0, 0, 3, 3) == [(0,0), (1,1), (2,2), (3,3)], "perfect diagonal"
  assert bresenham(2, 2, 2, 2) == [(2,2)], "degenerate single cell"
  _c = bresenham(5, 5, 2, 1)
  assert _c[0] == (5, 5) and _c[-1] == (2, 1), "must work in every direction, endpoints inclusive"
  for _a, _b in zip(_c, _c[1:]):
      assert max(abs(_a[0]-_b[0]), abs(_a[1]-_b[1])) == 1, "consecutive cells must be neighbors (8-connected)"
  _c = bresenham(0, 0, 2, 5)
  assert len(_c) == 6 and _c[0] == (0,0) and _c[-1] == (2,5), "shallow line: one cell per column"
hints:
  - "Setup: dy, dx = abs(y1-y0), abs(x1-x0); sy, sx = signs; err = dx - dy."
  - "Loop: append (y, x); stop at the endpoint; e2 = 2*err; if e2 > -dy: err -= dy; x += sx; if e2 < dx: err += dx; y += sy."
solution: |
  import numpy as np

  def bresenham(y0, x0, y1, x1):
      cells = []
      dy, dx = abs(y1 - y0), abs(x1 - x0)
      sy, sx = (1 if y1 >= y0 else -1), (1 if x1 >= x0 else -1)
      err = dx - dy
      y, x = y0, x0
      while True:
          cells.append((y, x))
          if (y, x) == (y1, x1):
              return cells
          e2 = 2 * err
          if e2 > -dy:
              err -= dy
              x += sx
          if e2 < dx:
              err += dx
              y += sy

  print(bresenham(0, 0, 2, 5))
