id: map-l1-logodds
title: "The log-odds map update"
lesson: modules/04-mapping/01-occupancy-grids
description: >-
  Implement the inverse sensor model: one beam carves free space along its
  cells and deposits occupancy at a hit, in clamped log-odds. The tests
  include the map-healing case — the behavior the clamp exists to buy.
setup_code: |
  import numpy as np

  def bresenham(y0, x0, y1, x1):
      """Grid cells on the line from (y0, x0) to (y1, x1), endpoints included.

      Note the argument order: row first, then column — these are array
      indices, not (x, y) coordinates. Returns a list of (row, col).
      """
      cells = []
      dy, dx = abs(y1 - y0), abs(x1 - x0)
      sy, sx = (1 if y1 >= y0 else -1), (1 if x1 >= x0 else -1)
      err = dx - dy
      y, x = y0, x0
      while True:
          cells.append((y, x))
          if (y, x) == (y1, x1):
              return cells
          e2 = 2 * err
          if e2 > -dy:
              err -= dy
              x += sx
          if e2 < dx:
              err += dx
              y += sy

  L_FREE, L_OCC, L_CLAMP = -0.4, 0.85, 6.0
