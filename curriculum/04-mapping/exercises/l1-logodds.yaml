tests: |
  import numpy as np
  _m = np.zeros((20, 20))
  update_ray(_m, (10, 2), (10, 12), hit=True)
  assert _m[10, 12] > 0, "hit endpoint must gain occupied evidence"
  assert _m[10, 7] < 0, "cells along the beam must gain free evidence"
  assert _m[10, 2] < 0, "the sensor's own cell is on the beam: free"
  assert abs(probability(np.zeros((1,1)))[0,0] - 0.5) < 1e-9, "log-odds 0 must map to p = 0.5"
  _m2 = np.zeros((20, 20))
  update_ray(_m2, (10, 2), (10, 12), hit=False)
  assert _m2[10, 12] < 0, "a max-range MISS makes the end cell free too — no phantom obstacle"
  _m3 = np.zeros((20, 20))
  for _ in range(200):
      update_ray(_m3, (10, 2), (10, 12), hit=True)
  assert _m3[10, 12] <= 6.0 + 1e-9, "log-odds must clamp at +/-L_CLAMP"
  for _ in range(40):
      update_ray(_m3, (10, 2), (10, 18), hit=True)   # sustained free evidence through (10,12)
  assert _m3[10, 12] < 0, "the clamp exists so sustained contrary evidence can RECLAIM a cell (map healing) — got %.2f" % _m3[10, 12]
  _m4 = np.zeros((5, 5))
  update_ray(_m4, (2, 2), (2, 30), hit=True)   # beam exits the grid
  assert np.isfinite(_m4).all(), "out-of-grid cells must be skipped, not crash"
hints:
  - "cells = bresenham(*c0, *c1); for each cell but the last add L_FREE (if in bounds); last cell gets L_OCC if hit else L_FREE; then np.clip the grid in place."
  - "Healing math: a cell clamped at +6.0 needs 6.0/0.4 = 15 free passes to reach 0 — without the clamp, 200 hits would need 425 passes."
solution: |
  import numpy as np

  def update_ray(log_odds, c0, c1, hit):
      rows, cols = log_odds.shape
      cells = bresenham(c0[0], c0[1], c1[0], c1[1])
      for (y, x) in cells[:-1]:
          if 0 <= y < rows and 0 <= x < cols:
              log_odds[y, x] += L_FREE
      y, x = cells[-1]
      if 0 <= y < rows and 0 <= x < cols:
          log_odds[y, x] += L_OCC if hit else L_FREE
      np.clip(log_odds, -L_CLAMP, L_CLAMP, out=log_odds)

  def probability(log_odds):
      return 1.0 - 1.0 / (1.0 + np.exp(log_odds))

  m = np.zeros((20, 20))
  update_ray(m, (10, 2), (10, 12), hit=True)
  print(probability(m)[10, 12], probability(m)[10, 7])
