id: rl-l6-tokenization
title: "Action tokenization: how coarse is too coarse?"
lesson: modules/09-robot-learning/06-vla-evaluation
description: >-
  VLAs emit actions as discrete tokens. Implement the tokenizer, then run
  the controller through it at several vocabulary sizes. You'll find 256
  bins is indistinguishable from continuous control — and that a hopeless
  4-bin tokenizer still scores 0.97 on success rate, which is a lesson
  about your metric rather than about tokens.
setup_code: |
  import numpy as np

  A_LOW, A_HIGH = -1.5, 1.5       # the action range a VLA would tokenize
  LANE_LIMIT, PROC_NOISE, MEAS_NOISE = 1.2, 0.02, 0.04
  TOLERANCE = 0.10                # "precise" means holding within this

  def _push(x):
      return 1.5 * np.sign(x) * max(0.0, abs(x) - 0.25)

  def plant_step(x, a, rng):
      return 1.30 * x + _push(x) + a + rng.normal(0, PROC_NOISE)
