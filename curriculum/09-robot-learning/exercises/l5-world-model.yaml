id: rl-l5-world-model
title: "Plan through a model you learned"
lesson: modules/09-robot-learning/05-world-models
description: >-
  Fit a dynamics model from logged transitions, then plan through it with
  lesson 2.6's sampling MPC — the swap that turns model predictive control
  into model-based RL. Measure how fast imagined rollouts drift from
  reality, then discover that replanning makes a badly-drifting model
  perfectly usable anyway.
setup_code: |
  import numpy as np

  BOUND = 3.0

  def true_step(x, a):
      """The real system: an outward force that saturates. Your logs will
      only ever sample it near the origin."""
      return float(np.clip(x + a + 0.45 * np.tanh(1.8 * x), -BOUND, BOUND))

  def collect_logs(n=900, seed=0):
      """Transitions from ordinary operation — all near the origin."""
      rng = np.random.default_rng(seed)
      X = rng.uniform(-0.35, 0.35, n)
      A = rng.uniform(-0.35, 0.35, n)
      Y = np.array([true_step(x, a) for x, a in zip(X, A)])
      return X, A, Y

  LOG_X, LOG_A, LOG_Y = collect_logs()
