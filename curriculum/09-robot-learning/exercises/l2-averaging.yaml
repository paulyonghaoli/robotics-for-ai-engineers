id: rl-l2-averaging
title: "The policy that drove into the obstacle"
lesson: modules/09-robot-learning/02-multimodality
description: >-
  Demonstrators go left or right around an obstacle, and every one of them
  succeeds. Fit their actions with mean-squared error and the policy drives
  straight into it — not because training failed, but because it succeeded.
  Then fix it by classifying over discretized actions instead of regressing.
setup_code: |
  import numpy as np

  HALF_WIDTH = 0.5      # you must pass at least this far from the centre
  OFFSET = 0.8          # how far demonstrators actually swerve

  _rng = np.random.default_rng(0)
  # Each demo: the obstacle sits at lateral position c; the demonstrator
  # commits to one side. BOTH choices are correct.
  OBSTACLE_C = _rng.uniform(-0.3, 0.3, 4000)
  _side = _rng.choice([-1.0, 1.0], size=4000)
  DEMO_ACTION = OBSTACLE_C + _side * OFFSET

  # Discretized action grid for the classification policy.
  ACTION_BINS = np.linspace(-1.5, 1.5, 31)

  def clears(action, c):
      """Did this action pass far enough from the obstacle?"""
      return abs(action - c) >= HALF_WIDTH
