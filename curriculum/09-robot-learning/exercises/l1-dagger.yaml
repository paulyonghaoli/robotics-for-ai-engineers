id: rl-l1-dagger
title: "DAgger: label the states you actually visit"
lesson: modules/09-robot-learning/01-behavior-cloning
description: >-
  The expert corrects harder when it is far from centre — but it is never
  far from centre, so its demonstrations never show that. A cloned policy
  drifts out, under-corrects, and diverges. Implement DAgger: roll out,
  ask the expert what it would have done *there*, retrain. Watch coverage
  and success climb together.
setup_code: |
  import numpy as np

  LANE_LIMIT, NOISE = 1.0, 0.02
  BINS = np.linspace(-1.0, 1.0, 21)          # 20 bins over the lane

  def _push(x):
      """The plant shoves you further out once you are genuinely off track."""
      return 0.9 * np.sign(x) * max(0.0, abs(x) - 0.35)

  def expert_action(x):
      """Stabilizes near centre AND cancels the outward push far out.
      The second half is the recovery skill the demos will never show."""
      return -0.45 * x - _push(x)

  def step(x, a, rng):
      return 1.30 * x + _push(x) + a + rng.normal(0, NOISE)

  def bin_of(x):
      return int(np.clip(np.digitize(x, BINS) - 1, 0, len(BINS) - 2))

  def collect_expert_demos(n_episodes=40, horizon=30, seed=0):
      """The expert starts near centre and contracts toward it, so these
      states only ever populate the middle bins."""
      rng = np.random.default_rng(seed)
      X = []
      for _ in range(n_episodes):
          x = rng.uniform(-0.25, 0.25)
          for _ in range(horizon):
              X.append(x)
              x = step(x, expert_action(x), rng)
      return np.array(X)

  DEMO_X = collect_expert_demos()

  # Deployment does not start where the demonstrations did. This is the
  # ordinary case, not an adversarial one.
  DEPLOY_X0 = 0.55
