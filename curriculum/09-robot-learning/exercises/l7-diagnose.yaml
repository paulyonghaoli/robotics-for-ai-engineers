tests: |
  import numpy as np
  # Every policy looks fine on the metric people usually report.
  for _n, _p in POLICIES.items():
      _c, _a, _ok = sample(_p, 200, TRAIN_RANGE, NOMINAL_NOISE)
      assert np.mean(np.abs(_a - _c)) < 1.2, "all four produce sane-looking actions on nominal data"
  assert nominal_success(POLICIES["A"]) > 0.95, "the healthy policy works nominally"
  assert wide_success(POLICIES["A"]) > 0.95 and noisy_success(POLICIES["A"]) > 0.9, "...and holds up under both stresses"
  assert novel_action_rate(POLICIES["A"]) < 0.1, "...without inventing actions"
  # B: averages two valid modes into an invalid one.
  assert nominal_success(POLICIES["B"]) < 0.1, "the averager should collide (got %.2f)" % nominal_success(POLICIES["B"])
  assert novel_action_rate(POLICIES["B"]) > 0.9, "...and its actions match NEITHER demonstrated mode (got %.2f)" % novel_action_rate(POLICIES["B"])
  # C: fine where it has data, lost outside.
  assert nominal_success(POLICIES["C"]) > 0.95, "the coverage-gap policy is fine inside its training range"
  assert wide_success(POLICIES["C"]) < 0.8, "...and fails outside it (got %.2f)" % wide_success(POLICIES["C"])
  assert noisy_success(POLICIES["C"]) > 0.85, "...but noise alone doesn't bother it - that's what separates it from D"
  # D: no margin, so only the noise stress exposes it.
  assert nominal_success(POLICIES["D"]) > 0.95, "the sim-overfit policy looks perfect nominally"
  assert noisy_success(POLICIES["D"]) < 0.75, "...and degrades under noise (got %.2f)" % noisy_success(POLICIES["D"])
  assert wide_success(POLICIES["D"]) > 0.9, "...while handling a wider range fine - that's what separates it from C"
  _want = {"A": "healthy", "B": "mode-averaging", "C": "coverage-gap", "D": "sim-overfit"}
  for _n, _lab in _want.items():
      assert diagnose(POLICIES[_n]) == _lab, "policy %s should be %r, got %r" % (_n, _lab, diagnose(POLICIES[_n]))
hints:
  - "The three success probes are the same call with different arguments: `sample(policy, n, c_range, noise, seed)` then `float(np.mean(cleared))`. Use c_range=TRAIN_RANGE/0.7/TRAIN_RANGE and noise=NOMINAL_NOISE/NOMINAL_NOISE/6*NOMINAL_NOISE."
  - "novel_action_rate: sample nominally, then for each (c, a) compute `min(abs(a - (c+OFFSET)), abs(a - (c-OFFSET)))` and count how often that exceeds `tol`."
  - "diagnose: check novel actions FIRST — a mode-averager also fails the other probes, but the novel-action signature is what identifies it. Then use wide vs noisy to separate a coverage gap from a missing safety margin."
  - "The point of the whole exercise: all four have low held-out error, and no single probe separates all four. Diagnosis needs a *panel*."
solution: |
  import numpy as np

  def nominal_success(policy, n=400):
      _, _, ok = sample(policy, n, TRAIN_RANGE, NOMINAL_NOISE, seed=1)
      return float(np.mean(ok))

  def wide_success(policy, n=400):
      _, _, ok = sample(policy, n, 0.7, NOMINAL_NOISE, seed=2)
      return float(np.mean(ok))

  def noisy_success(policy, n=400):
      _, _, ok = sample(policy, n, TRAIN_RANGE, 6 * NOMINAL_NOISE, seed=3)
      return float(np.mean(ok))

  def novel_action_rate(policy, n=400, tol=0.4):
      cs, acts, _ = sample(policy, n, TRAIN_RANGE, NOMINAL_NOISE, seed=4)
      d = np.minimum(np.abs(acts - (cs + OFFSET)), np.abs(acts - (cs - OFFSET)))
      return float(np.mean(d > tol))

  def diagnose(policy):
      if novel_action_rate(policy) > 0.5:
          return "mode-averaging"
      nom = nominal_success(policy)
      if nom > 0.9 and wide_success(policy) < 0.8:
          return "coverage-gap"
      if nom > 0.9 and noisy_success(policy) < 0.8:
          return "sim-overfit"
      return "healthy"

  for name, pol in POLICIES.items():
      print("%s | nominal %.2f  wide %.2f  noisy %.2f  novel %.2f  -> %s" % (
          name, nominal_success(pol), wide_success(pol), noisy_success(pol),
          novel_action_rate(pol), diagnose(pol)))
