id: rl-l7-diagnose
title: "Four policies, four different diseases"
lesson: modules/09-robot-learning/07-lab-policy-memorized
description: >-
  Four trained policies. All four have low held-out error. One is healthy
  and three are broken in different ways — mode averaging, a coverage gap,
  and overfitting to nominal conditions. Build the probes that tell them
  apart, because held-out error tells you nothing.
setup_code: |
  import numpy as np

  # Swerve around an obstacle sitting at lateral position c. BOTH c+0.8
  # and c-0.8 are valid demonstrations; anything within 0.5 of c collides.
  OFFSET, HALF_WIDTH = 0.8, 0.5
  TRAIN_RANGE = 0.25        # obstacle positions the training data covered
  NOMINAL_NOISE = 0.02      # observation noise during training/nominal use

  def clears(a, c):
      return abs(a - c) >= HALF_WIDTH

  # --- the four policies. Each sees a noisy observation of c. -----------
  def healthy(c_obs):
      return c_obs + OFFSET

  def averager(c_obs):
      """Trained with MSE on demonstrations that went both ways."""
      return c_obs

  COVERED = 0.38            # how far this policy's training data reached

  def coverage_gap(c_obs):
      """Fine inside the region its data covered; adrift outside it."""
      return c_obs + OFFSET if abs(c_obs) <= COVERED else c_obs

  def sim_overfit(c_obs):
      """Tuned until it just barely cleared under nominal noise."""
      return c_obs + 0.55

  POLICIES = {"A": healthy, "B": averager, "C": coverage_gap, "D": sim_overfit}

  def sample(policy, n, c_range, noise, seed=0):
      """Run n trials; return (obstacle positions, actions taken, cleared?)."""
      rng = np.random.default_rng(seed)
      cs = rng.uniform(-c_range, c_range, n)
      acts = np.array([policy(c + rng.normal(0, noise)) for c in cs])
      return cs, acts, np.array([clears(a, c) for a, c in zip(acts, cs)])
