tests: |
  import numpy as np
  _base = fit(SEED_STATES)
  _b = success_rate(_base)
  assert _b < 0.4, "the starting policy should be weak (got %.2f)" % _b
  _iv = intervention_states(_base, 200)
  assert len(_iv) >= 200, "must return the requested number of states"
  assert np.max(np.abs(_iv)) > 0.5, "interventions must include states OUT where the policy struggles (max |x| = %.2f)" % np.max(np.abs(_iv))
  _demo_only = success_rate(spend_on_demos(BUDGET))
  _inter_only = success_rate(spend_on_interventions(BUDGET))
  _mixed = success_rate(spend_mixed(BUDGET))
  assert _demo_only < 0.45, "600 more expert demos barely help (got %.2f) - they re-label a region already covered" % _demo_only
  assert _inter_only > 0.85, "600 states of intervention should nearly solve it (got %.2f)" % _inter_only
  assert _inter_only > _demo_only + 0.4, "SAME budget, same labeller: interventions must massively outperform demos (%.2f vs %.2f)" % (_inter_only, _demo_only)
  assert _mixed > _demo_only + 0.4, "the mixed policy should also land near the top (got %.2f)" % _mixed
  # And more demos is not the answer: triple the demo budget, still stuck.
  _demo_triple = success_rate(spend_on_demos(BUDGET * 3))
  assert _demo_triple < 0.55, "even 3x the demonstration budget doesn't fix it (got %.2f) - this is a coverage problem, not a volume problem" % _demo_triple
hints:
  - "intervention_states: `out = []`; `for s in range(seed, seed+500): _, v = rollout(policy, s); out.extend(v);` break once `len(out) >= n`; return `np.array(out[:n])`."
  - "spend_on_interventions: start from SEED_STATES, then repeat `rounds` times — fit the current states, collect `budget // rounds` intervention states from THAT policy, and append. Refitting between rounds is what lets later batches target the improved policy."
  - "spend_mixed: add `int(budget * demo_fraction)` demo states first, then run the intervention loop with the remainder."
  - "The result to internalize: the demonstration budget is spent re-labelling a region already densely covered, so it buys almost nothing. Tripling it changes little. Coverage, not volume."
solution: |
  import numpy as np

  def intervention_states(policy, n, seed=100):
      out = []
      for s in range(seed, seed + 500):
          _, v = rollout(policy, s)
          out.extend(v)
          if len(out) >= n:
              break
      return np.array(out[:n])

  def spend_on_demos(budget):
      extra = expert_demo_states(budget, seed=1)
      return fit(np.concatenate([SEED_STATES, extra]))

  def spend_on_interventions(budget, rounds=3):
      states = SEED_STATES.copy()
      per = budget // rounds
      for r in range(rounds):
          pol = fit(states)
          states = np.concatenate([states, intervention_states(pol, per, seed=100 + 1000 * r)])
      return fit(states)

  def spend_mixed(budget, demo_fraction=0.3, rounds=3):
      n_demo = int(budget * demo_fraction)
      states = np.concatenate([SEED_STATES, expert_demo_states(n_demo, seed=2)])
      per = (budget - n_demo) // rounds
      for r in range(rounds):
          pol = fit(states)
          states = np.concatenate([states, intervention_states(pol, per, seed=200 + 1000 * r)])
      return fit(states)

  base = fit(SEED_STATES)
  print("before spending      : %.2f" % success_rate(base))
  print("all demonstrations   : %.2f" % success_rate(spend_on_demos(BUDGET)))
  print("all interventions    : %.2f" % success_rate(spend_on_interventions(BUDGET)))
  print("30%% demos / 70%% inter: %.2f" % success_rate(spend_mixed(BUDGET)))
