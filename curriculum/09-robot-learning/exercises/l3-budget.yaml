id: rl-l3-budget
title: "Spend the labelling budget"
lesson: modules/09-robot-learning/03-data-engine
description: >-
  You have a fixed number of labelled states and three ways to spend them:
  all on fresh expert demonstrations, all on interventions where the policy
  actually fails, or a mix. Same cost, same labeller, very different
  policies. Find out which — and by how much.
setup_code: |
  import numpy as np

  LANE_LIMIT, NOISE, DEPLOY_X0 = 1.0, 0.02, 0.55
  BINS = np.linspace(-1.0, 1.0, 21)

  def _push(x):
      return 0.9 * np.sign(x) * max(0.0, abs(x) - 0.35)

  def expert_action(x):
      """The labeller. Costs the same per state wherever you ask it."""
      return -0.45 * x - _push(x)

  def step(x, a, rng):
      """Advance the plant one step under action `a`; returns the new state.

      The plant is open-loop UNSTABLE — with a = 0 the offset grows every
      step — so a slightly-wrong policy drifts away instead of settling.
      Consumes one draw from `rng`.
      """
      return 1.30 * x + _push(x) + a + rng.normal(0, NOISE)

  def bin_of(x):
      """Index of the state bin containing `x`, clamped to the valid range."""
      return int(np.clip(np.digitize(x, BINS) - 1, 0, len(BINS) - 2))

  def fit(states):
      """Label `states` with the expert and average per bin — the policy.

      Returns one action per bin, NaN where no state fell in that bin.
      Calling this is what costs labelling budget.
      """
      n = len(BINS) - 1
      sums, counts = np.zeros(n), np.zeros(n)
      for x in states:
          b = bin_of(x)
          sums[b] += expert_action(x); counts[b] += 1
      out = np.full(n, np.nan)
      out[counts > 0] = sums[counts > 0] / counts[counts > 0]
      return out

  def act(policy, x):
      b = bin_of(x)
      if not np.isnan(policy[b]):
          return float(policy[b])
      for d in range(1, len(policy)):
          for c in (b - d, b + d):
              if 0 <= c < len(policy) and not np.isnan(policy[c]):
                  return float(policy[c])
      return 0.0

  def rollout(policy, seed, horizon=60):
      """Run `policy` from the deployment start state for one seeded episode.

      Returns (survived, states visited). `survived` is False as soon as
      |x| exceeds LANE_LIMIT.
      """
      rng = np.random.default_rng(seed)
      x, visited = DEPLOY_X0, []
      for _ in range(horizon):
          visited.append(x)
          x = step(x, act(policy, x), rng)
          if abs(x) > LANE_LIMIT:
              return False, visited
      return True, visited

  def success_rate(policy, n=100):
      """Fraction of `n` seeded rollouts that stay in lane for the horizon."""
      return sum(rollout(policy, s)[0] for s in range(n)) / n

  def expert_demo_states(n, seed=0):
      """Fresh expert demonstrations. The expert starts near centre and
      stays there, so these are always drawn from the same narrow band."""
      rng = np.random.default_rng(seed)
      out = []
      while len(out) < n:
          x = rng.uniform(-0.25, 0.25)
          for _ in range(30):
              out.append(x)
              x = step(x, expert_action(x), rng)
              if len(out) >= n:
                  break
      return np.array(out[:n])

  SEED_STATES = expert_demo_states(300, seed=0)   # what you already have
  BUDGET = 600                                     # states you can still label
