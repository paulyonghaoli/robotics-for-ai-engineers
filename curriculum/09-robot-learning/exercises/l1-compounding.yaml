id: rl-l1-compounding
title: "Watch the error compound"
lesson: modules/09-robot-learning/01-behavior-cloning
description: >-
  Clone an expert lane-follower from its demonstrations, then run it
  closed-loop. Your validation error will be tiny and your policy will
  still drive off the road — because off the expert's distribution it is
  extrapolating. Measure failure rate against horizon and see the
  super-linear growth for yourself.
setup_code: |
  import numpy as np

  # Balancing-style task: the plant is OPEN-LOOP UNSTABLE (a pole tips over,
  # a Segway falls). State = offset from centre; without control it grows.
  # This is what makes cloning delicate — the margin between a gain that
  # stabilizes and one that doesn't is small, and the difference is
  # invisible on the expert's own data.
  PLANT = 1.55            # x grows by 55% per step with no action
  EXPERT_GAIN = 0.60      # expert closes the loop at 1.55 - 0.60 = 0.95 (stable)
  NOISE = 0.01
  LANE_LIMIT = 1.0

  def expert_action(x):
      return -EXPERT_GAIN * x

  def step(x, a, rng):
      """Advance the plant one step under action `a`; returns the new state.

      The plant is open-loop UNSTABLE — with a = 0 the offset grows every
      step — so a slightly-wrong policy drifts away instead of settling.
      Consumes one draw from `rng`.
      """
      return PLANT * x + a + rng.normal(0, NOISE)

  def collect_demos(n_episodes=60, horizon=40, seed=0):
      """Expert rollouts. The expert corrects immediately, so its data sits
      in a narrow band near centre — it never demonstrates recovery from
      the states a slightly-wrong policy will drift into."""
      rng = np.random.default_rng(seed)
      X, A = [], []
      for _ in range(n_episodes):
          x = rng.uniform(-0.35, 0.35)
          for _ in range(horizon):
              a = expert_action(x)
              X.append(x); A.append(a)
              x = step(x, a, rng)
      return np.array(X), np.array(A)

  DEMO_X, DEMO_A = collect_demos()
