tests: |
  import numpy as np
  _w, _b = fit_policy(DEMO_X, DEMO_A)
  assert abs(_w - (-EXPERT_GAIN)) < 0.05, "the fit should recover the expert gain closely (got %.3f vs %.3f)" % (_w, -EXPERT_GAIN)
  _val = validation_error(_w, _b, DEMO_X, DEMO_A)
  assert _val < 0.01, "validation error on expert data must be TINY (got %.4f) - that is what makes this trap work" % _val
  assert rollout(-EXPERT_GAIN, 0.0, 200, seed=1) is True, "the true expert policy should survive a long horizon"
  # A slightly-off policy. Its validation error is tiny, but 1.55 - 0.53
  # = 1.02 > 1: the closed loop now GROWS instead of shrinking, slowly.
  _wb, _bb = -0.53, 0.008
  assert validation_error(_wb, _bb, DEMO_X, DEMO_A) < 0.04, "the flawed policy's validation error is small - that is the point"
  _fr = [failure_rate(_wb, _bb, h) for h in (25, 50, 100, 200)]
  assert all(_fr[i] >= _fr[i - 1] for i in range(1, 4)), "failure rate must be non-decreasing in horizon (got %s)" % [round(f, 2) for f in _fr]
  assert _fr[0] < 0.25, "at horizon 25 it should mostly succeed - short tasks HIDE the problem (got %.2f)" % _fr[0]
  assert _fr[2] > 0.75, "by horizon 100 the same policy should fail almost every episode (got %.2f)" % _fr[2]
  # The transition is abrupt, and that is the point: divergence is
  # exponential, so the failure does not creep in - it arrives.
  assert _fr[1] > _fr[0], "the failure must appear somewhere between horizon 25 and 100"
hints:
  - "fit_policy: `w, b = np.polyfit(X, A, 1)` and return them as floats."
  - "rollout: loop `horizon` times — `a = w*x + b`, `x = step(x, a, rng)`, and `if abs(x) > LANE_LIMIT: return False`. Return True if the loop finishes."
  - "failure_rate: `sum(not rollout(w, b, horizon, seed=s) for s in range(n)) / n`."
  - "The trap: gain -0.53 instead of -0.60 is a 12% error, invisible in validation. But the plant multiplies by 1.55 each step, so the closed loop goes from 0.95 (shrinking) to 1.02 (growing). Growth compounds — which is why the failure is invisible at horizon 25 and total at horizon 200."
solution: |
  import numpy as np

  def fit_policy(X, A):
      w, b = np.polyfit(X, A, 1)
      return float(w), float(b)

  def validation_error(w, b, X, A):
      return float(np.mean(np.abs((w * X + b) - A)))

  def rollout(w, b, horizon, seed, x0=0.3):
      rng = np.random.default_rng(seed)
      x = x0
      for _ in range(horizon):
          a = w * x + b
          x = step(x, a, rng)
          if abs(x) > LANE_LIMIT:
              return False
      return True

  def failure_rate(w, b, horizon, n=200):
      return sum(not rollout(w, b, horizon, seed=s) for s in range(n)) / n

  w, b = fit_policy(DEMO_X, DEMO_A)
  print("fitted policy: a = %.4f x + %.4f  (expert: a = %.4f x)" % (w, b, -EXPERT_GAIN))

  # A perfect clone is safe. Now a clone that is 12%% off - the kind of
  # error any finite dataset or function approximator produces.
  for name, (pw, pb) in [("exact clone", (w, b)), ("12% low", (-0.53, 0.008))]:
      mae = validation_error(pw, pb, DEMO_X, DEMO_A)
      rates = " ".join("h=%d:%.2f" % (h, failure_rate(pw, pb, h)) for h in (25, 50, 100, 200))
      print("%-12s val MAE %.4f  |  %s" % (name, mae, rates))
