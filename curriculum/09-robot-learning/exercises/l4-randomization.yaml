id: rl-l4-randomization
title: "Measure the randomization tax"
lesson: modules/09-robot-learning/04-sim-to-real
description: >-
  Your simulator is missing a force that reality has. Tune a controller on
  the simulator alone and it scores 100% there and 0% on the real robot.
  Train it across randomized simulators instead and it works on both — for
  a price. Measure that price, then over-randomize and watch it grow.
setup_code: |
  import numpy as np

  LANE_LIMIT, PROC_NOISE, MEAS_NOISE, THRESHOLD = 1.2, 0.02, 0.06, 0.25
  GAIN_GRID = np.round(np.arange(0.4, 2.35, 0.1), 2)

  # The simulator models a plant of 1.30 and nothing else. REALITY also
  # shoves the robot outward once it strays past THRESHOLD - a force the
  # simulator's author never knew about. push_gain = 0.0 is the nominal
  # simulator; reality is push_gain = 1.5.
  REALITY_PUSH = 1.5

  def _push(x, g):
      return g * np.sign(x) * max(0.0, abs(x) - THRESHOLD)

  def episode(k, push_gain, seed, horizon=60, x0=0.6):
      """Returns (survived, mean |x|) — success and tracking quality."""
      rng = np.random.default_rng(seed)
      x, total = x0, 0.0
      for _ in range(horizon):
          a = -k * (x + rng.normal(0, MEAS_NOISE))
          x = 1.30 * x + _push(x, push_gain) + a + rng.normal(0, PROC_NOISE)
          total += abs(x)
          if abs(x) > LANE_LIMIT:
              return False, total / horizon
      return True, total / horizon
