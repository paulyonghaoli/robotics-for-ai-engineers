  # push_gain = 0.0 is the nominal simulator; 1.5 is reality.

  def evaluate(k, push_gain, n=60):
      """Return (success_rate, mean tracking cost over surviving episodes).
      If nothing survives, return (0.0, 99.0)."""
      # TODO
      return 0.0, 99.0

  def train_on_nominal():
      """Pick the gain that performs best on the nominal simulator alone:
      maximize success, break ties by LOWEST tracking cost."""
      # TODO
      return GAIN_GRID[0]

  def train_randomized(max_push, n_samples=6):
      """Train across simulators with push_gain sampled evenly over
      [0, max_push]. Score each gain by its WORST-CASE success across those
      simulators, breaking ties by mean tracking cost."""
      # TODO
      return GAIN_GRID[0]

  k_nom = train_on_nominal()
  k_rand = train_randomized(REALITY_PUSH)
