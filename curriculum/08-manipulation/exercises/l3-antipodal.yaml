  def is_antipodal(p1, n1, p2, n2, mu=MU):
      """True if the grip line lies inside BOTH friction cones.

      g = unit vector from p1 to p2. The contact at p1 pushes along +g and
      at p2 along -g, so require:
          angle(g, -n1) <= atan(mu)   and   angle(-g, -n2) <= atan(mu)
      """
      # TODO
      return False

  def grasp_quality(p1, n1, p2, n2, mu=MU, scale=0.05):
      """Score a candidate. Return 0.0 for anything unusable.

      Zero if not antipodal, and zero if the opening ||p2 - p1|| falls
      outside [W_MIN, W_MAX] — a grasp the gripper cannot physically make is
      worth nothing, however good the mechanics look.

      Otherwise:  min(cos theta_1, cos theta_2) * exp(-d_com / scale)
      where theta_i is each contact's angle inside its cone and d_com is the
      distance from the grip midpoint to COM.
      """
