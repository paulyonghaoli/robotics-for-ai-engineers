id: man-l3-antipodal
title: "Antipodal grasps, and the gripper that only opens 9 cm"
lesson: modules/08-manipulation/03-grasping
description: >-
  Find two-finger grasps on a 2D object outline. A grasp qualifies when the
  line between the contacts lies inside BOTH friction cones — and when the
  gripper can physically open that far, which is the constraint that turns a
  page of sound mechanics into an unexecutable plan if you leave it out.
setup_code: |
  import numpy as np

  MU = 0.5                       # friction coefficient -> cone half-angle 26.6 deg
  W_MIN, W_MAX = 0.02, 0.09      # the gripper's stroke, metres

  def box_outline(w=0.06, h=0.14, n=160):
      """Contacts sampled around a rectangle, with outward normals."""
      per = n // 4
      pts, nrm = [], []
      for (x0, y0), (x1, y1), nv in (
              ((-w/2, -h/2), ( w/2, -h/2), (0.0, -1.0)),
              (( w/2, -h/2), ( w/2,  h/2), (1.0,  0.0)),
              (( w/2,  h/2), (-w/2,  h/2), (0.0,  1.0)),
              ((-w/2,  h/2), (-w/2, -h/2), (-1.0, 0.0))):
          t = np.linspace(0, 1, per, endpoint=False)
          pts.append(np.stack([x0 + t*(x1-x0), y0 + t*(y1-y0)], axis=1))
          nrm.append(np.tile(nv, (per, 1)))
      return np.vstack(pts), np.vstack(nrm)

  def disc_outline(r=0.055, n=160):
      """Contacts sampled around a disc, with outward normals.

      Returns (points, normals), both shape (n, 2) — the same contract as
      `box_outline`, so a grasp routine can take either shape.
      """
      a = np.linspace(0, 2*np.pi, n, endpoint=False)
      p = np.stack([r*np.cos(a), r*np.sin(a)], axis=1)
      return p, p / r

  COM = np.zeros(2)              # centre of mass, at the origin for both shapes
