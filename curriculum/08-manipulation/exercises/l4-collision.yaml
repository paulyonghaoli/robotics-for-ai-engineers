id: man-l4-collision
title: "Collision checking, and the edge nobody checked"
lesson: modules/08-manipulation/04-cspace-planning
description: >-
  Two functions. The first asks whether a configuration collides; the second
  asks whether the straight line between two collision-free configurations
  does. The second is the one that matters — checking only the endpoints of a
  path is the most common serious bug in a hand-rolled motion planner, and it
  produces verified paths that collide.
setup_code: |
  import numpy as np

  LINKS = np.array([1.0, 0.8, 0.6])
  LINK_RADIUS = 0.04

  # Circular obstacles: (x, y, radius)
  OBSTACLES = np.array([[1.10, 0.90, 0.28],
                        [1.60, -0.70, 0.22]])

  def joint_positions(q, links=LINKS):
      q = np.asarray(q, dtype=float)
      ang = np.cumsum(q)
      seg = np.stack([links * np.cos(ang), links * np.sin(ang)], axis=1)
      return np.vstack([np.zeros(2), np.cumsum(seg, axis=0)])
