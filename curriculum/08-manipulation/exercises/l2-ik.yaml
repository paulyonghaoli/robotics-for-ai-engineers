id: man-l2-ik
title: "Damped IK that respects the joints it has"
lesson: modules/08-manipulation/02-inverse-kinematics
description: >-
  Iterative inverse kinematics with damped least squares, plus the two things
  that separate a solver from a demo: it must respect joint limits, and it
  must distinguish "I could not converge" from "that target is outside the
  workspace." Those need different responses, and returning the same failure
  for both is how an unreachable goal gets retried forever.
setup_code: |
  import numpy as np

  LINKS = np.array([1.0, 0.8, 0.6])
  Q_MIN = np.array([-2.6, -2.4, -2.4])
  Q_MAX = np.array([ 2.6,  2.4,  2.4])
  REACH = float(LINKS.sum())

  def joint_positions(q, links=LINKS):
      """Cartesian positions of the base, every joint, and the tip.

      Returns shape (len(q) + 1, 2) starting at the origin. Joint angles
      are relative to the previous link, so they accumulate.
      """
      q = np.asarray(q, dtype=float)
      ang = np.cumsum(q)
      seg = np.stack([links * np.cos(ang), links * np.sin(ang)], axis=1)
      return np.vstack([np.zeros(2), np.cumsum(seg, axis=0)])

  def fk(q):
      """Forward kinematics: the (x, y) tip position for configuration `q`."""
      return joint_positions(q)[-1]

  def jacobian(q):
      """2x3 Jacobian d(tip position) / dq for the planar chain.

      Column j is how the tip moves when joint j rotates. It is wider than
      it is tall, so it has a null space — joint motions that leave the
      tip exactly where it is.
      """
      pts = joint_positions(q)
      d = pts[-1] - pts[:-1]
      return np.stack([-d[:, 1], d[:, 0]])
starter_code: |
  import numpy as np
  # Provided: LINKS, Q_MIN, Q_MAX, REACH (2.4 m), joint_positions, fk, jacobian

  def solve_ik(target, q0, damping=0.08, iters=200, tol=1e-4):
      """Return (q, status).

      status is one of:
        'ok'          converged to within `tol` of the target
        'unreachable' the target lies outside the arm's reach
        'no_converge' inside the workspace, but this start did not get there

      Each step:  dq = J.T @ solve(J @ J.T + damping^2 I, error)
      then q += dq, then CLIP q to [Q_MIN, Q_MAX].

      Check reachability BEFORE iterating: a target beyond REACH cannot be
      reached from any start, and reporting that as a convergence failure
      invites a caller to retry it forever with new seeds.
      """
      # TODO
      return np.asarray(q0, dtype=float), "no_converge"

  q0 = np.array([0.3, 0.5, 0.2])
  for name, tgt in (("reachable", np.array([1.4, 0.9])),
                    ("far but reachable", np.array([2.2, 0.3])),
                    ("outside the workspace", np.array([3.5, 0.0]))):
      q, status = solve_ik(tgt, q0)
      print("%-24s -> %-12s error %.5f m" % (name, status, np.linalg.norm(fk(q) - tgt)))
tests: |
  import numpy as np
  _q0 = np.array([0.3, 0.5, 0.2])

  # Ordinary targets converge.
  _rng = np.random.default_rng(0)
  for _ in range(20):
      _qt = _rng.uniform(-1.2, 1.2, 3)
      _tgt = fk(_qt)
      _q, _st = solve_ik(_tgt, _q0)
      assert _st == "ok", "target %s (generated from a valid configuration) reported %s" % (np.round(_tgt, 3), _st)
      assert np.linalg.norm(fk(_q) - _tgt) < 1e-4, "status 'ok' but the error is %.5f m" % np.linalg.norm(fk(_q) - _tgt)

  # Joint limits are hard.
  for _ in range(20):
      _tgt = fk(_rng.uniform(-1.2, 1.2, 3))
      _q, _ = solve_ik(_tgt, _q0)
      assert np.all(_q >= Q_MIN - 1e-9) and np.all(_q <= Q_MAX + 1e-9), "returned a configuration outside the joint limits: %s" % np.round(_q, 3)

  # Out of reach is reported as such, not as a convergence failure.
  for _far in ([3.5, 0.0], [0.0, 4.0], [-3.0, 2.5]):
      _q, _st = solve_ik(np.array(_far), _q0)
      assert _st == "unreachable", "target %s is %.2f m from the base with a reach of %.2f m, so it must be reported 'unreachable', got '%s'" % (_far, np.linalg.norm(_far), REACH, _st)

  # Damping must actually be used: with a big damping value the solver should
  # still make progress, just slower.
  _tgt = fk(np.array([0.6, 0.5, -0.3]))
  _q, _st = solve_ik(_tgt, _q0, damping=0.5, iters=800)
  assert np.linalg.norm(fk(_q) - _tgt) < 5e-3, "with heavy damping the solver should still converge given more iterations, error %.4f" % np.linalg.norm(fk(_q) - _tgt)

  # A target just inside the boundary is reachable and must not be rejected.
  _edge = np.array([REACH - 0.02, 0.0])
  _q, _st = solve_ik(_edge, _q0, iters=600)
  assert _st != "unreachable", "a target %.2f m out is inside a %.2f m reach" % (np.linalg.norm(_edge), REACH)
hints:
  - "Reachability first: `if np.linalg.norm(target) > REACH: return q0, 'unreachable'`. It is one line, and it is what stops a caller retrying an impossible goal with fresh seeds forever."
  - "The step is the damped least squares from lesson 8.1: `A = J @ J.T + damping**2 * np.eye(2)`, `dq = J.T @ np.linalg.solve(A, err)`. Clip after adding, so the limits are enforced on the configuration rather than on the step."
  - "Break out as soon as `norm(err) < tol` and return 'ok'; if the loop finishes without that, return 'no_converge'."
solution: |
  import numpy as np

  def solve_ik(target, q0, damping=0.08, iters=200, tol=1e-4):
      target = np.asarray(target, dtype=float)
      # Geometric impossibility is not a convergence problem, and conflating
      # them makes a caller retry an unreachable goal with new seeds forever.
      if np.linalg.norm(target) > REACH:
          return np.asarray(q0, dtype=float).copy(), "unreachable"

      q = np.asarray(q0, dtype=float).copy()
      for _ in range(iters):
          err = target - fk(q)
          if np.linalg.norm(err) < tol:
              return q, "ok"
          J = jacobian(q)
          A = J @ J.T + (damping ** 2) * np.eye(2)
          q = np.clip(q + J.T @ np.linalg.solve(A, err), Q_MIN, Q_MAX)
      return q, ("ok" if np.linalg.norm(target - fk(q)) < tol else "no_converge")

  q0 = np.array([0.3, 0.5, 0.2])
  for name, tgt in (("reachable", np.array([1.4, 0.9])),
                    ("far but reachable", np.array([2.2, 0.3])),
                    ("outside the workspace", np.array([3.5, 0.0]))):
      q, status = solve_ik(tgt, q0)
      print("%-24s -> %-12s error %.5f m" % (name, status, np.linalg.norm(fk(q) - tgt)))
