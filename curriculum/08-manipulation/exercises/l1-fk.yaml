id: man-l1-fk
title: "Forward kinematics and the analytic Jacobian"
lesson: modules/08-manipulation/01-kinematics
description: >-
  Build the chain for an n-link planar arm: joint positions, tool pose, and
  the Jacobian. The Jacobian is checked against finite differences, which is
  the only way to be sure an analytic derivative is right — and the check
  that catches the sign and indexing errors that otherwise surface as a
  controller that drifts the wrong way.
setup_code: |
  import numpy as np

  LINKS = np.array([1.0, 0.8, 0.6])

  def wrap(a):
      w = np.mod(-np.asarray(a, dtype=float) + np.pi, 2.0 * np.pi)
      r = -(w - np.pi)
      return float(r) if np.ndim(a) == 0 else r
