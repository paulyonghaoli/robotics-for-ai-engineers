id: man-l2-nullspace
title: "Move the elbow without moving the gripper"
lesson: modules/08-manipulation/02-inverse-kinematics
description: >-
  A 3-link arm reaching an (x, y) target has one spare degree of freedom.
  Project a secondary objective into the null space and you pursue it while
  the tool stays *exactly* where it is — not approximately, exactly, to the
  precision of the linearisation. Here the secondary objective is keeping the
  joints away from their limits, which is what stops a solver walking into a
  configuration the hardware refuses.
setup_code: |
  import numpy as np

  LINKS = np.array([1.0, 0.8, 0.6])
  Q_MIN = np.array([-2.6, -2.4, -2.4])
  Q_MAX = np.array([ 2.6,  2.4,  2.4])
  Q_MID = 0.5 * (Q_MIN + Q_MAX)
  Q_SPAN = Q_MAX - Q_MIN

  def joint_positions(q, links=LINKS):
      """Cartesian positions of the base, every joint, and the tip.

      Returns shape (len(q) + 1, 2) starting at the origin. Joint angles
      are relative to the previous link, so they accumulate.
      """
      q = np.asarray(q, dtype=float)
      ang = np.cumsum(q)
      seg = np.stack([links * np.cos(ang), links * np.sin(ang)], axis=1)
      return np.vstack([np.zeros(2), np.cumsum(seg, axis=0)])

  def fk(q):
      """Forward kinematics: the (x, y) tip position for configuration `q`."""
      return joint_positions(q)[-1]

  def jacobian(q):
      """2x3 Jacobian d(tip position) / dq for the planar chain.

      Column j is how the tip moves when joint j rotates. It is wider than
      it is tall, so it has a null space — joint motions that leave the
      tip exactly where it is.
      """
      pts = joint_positions(q)
      d = pts[-1] - pts[:-1]
      return np.stack([-d[:, 1], d[:, 0]])

  def limit_cost(q):
      """How close the configuration sits to its limits. Lower is better."""
      return float(np.sum(((np.asarray(q) - Q_MID) / Q_SPAN) ** 2))
