id: man-l6-bug-coldstart
title: "Bug 3: the smooth path with a jump in the middle"
lesson: modules/08-manipulation/06-lab-arm-in-sim
description: >-
  **Symptom:** the tool follows a slow, smooth arc across the workspace, and
  once per traverse the arm slams from elbow-up to elbow-down. The tool pose
  is correct before and after. The task-space path is smooth to machine
  precision. Diagnose from the probe, then fix `follow_path`.
setup_code: |
  import numpy as np

  LINKS = np.array([1.0, 0.8, 0.6])

  def joint_positions(q, links=LINKS):
      q = np.asarray(q, dtype=float)
      ang = np.cumsum(q)
      seg = np.stack([links * np.cos(ang), links * np.sin(ang)], axis=1)
      return np.vstack([np.zeros(2), np.cumsum(seg, axis=0)])

  def fk(q):
      return joint_positions(q)[-1]

  def jacobian(q):
      p = joint_positions(q)
      d = p[-1] - p[:-1]
      return np.stack([-d[:, 1], d[:, 0]])

  def solve_ik(target, q0, damping=0.05, iters=300, tol=1e-6):
      """Damped least-squares IK from the seed q0."""
      q = np.asarray(q0, dtype=float).copy()
      for _ in range(iters):
          e = np.asarray(target, dtype=float) - fk(q)
          if np.linalg.norm(e) < tol:
              break
          J = jacobian(q)
          q = q + J.T @ np.linalg.solve(J @ J.T + damping**2 * np.eye(2), e)
      return q

  # A smooth arc of tool positions.
  _t = np.linspace(0.0, 1.0, 40)
  TOOL_PATH = np.stack([1.45 + 0.35 * np.cos(2.2 * _t - 0.4),
                        0.30 + 0.55 * np.sin(2.2 * _t - 0.4)], axis=1)
  # The configuration the arm is already in, and a valid IK solution for
  # the first waypoint — so a correct follow_path starts exactly here.
  Q_START = np.array([-0.4262, 1.5978, -1.5791])
starter_code: |
  import numpy as np
  # Provided: LINKS, fk(q), jacobian(q), solve_ik(target, q0), TOOL_PATH, Q_START

  FIXED_SEED = np.array([0.1, 0.1, 0.1])

  def follow_path(tool_path, q_start=Q_START):
      """Solve IK for each tool waypoint. Return the (N, 3) joint trajectory."""
      out = []
      for target in tool_path:
          out.append(solve_ik(target, FIXED_SEED))     # <-- suspicious
      return np.array(out)

  traj = follow_path(TOOL_PATH)
  steps = np.abs(np.diff(traj, axis=0)).max(axis=1)
  print("tool path is smooth   : max step %.5f m"
        % np.abs(np.diff(TOOL_PATH, axis=0)).max())
  print("joint path max step   : %.3f rad (%.0f deg)"
        % (steps.max(), np.degrees(steps.max())))
  print("worst waypoint        : %d of %d" % (int(np.argmax(steps)), len(traj)))
tests: |
  import numpy as np
  _traj = np.asarray(follow_path(TOOL_PATH))
  assert _traj.shape == (len(TOOL_PATH), 3), "expected one configuration per waypoint, got %s" % str(_traj.shape)

  # Every configuration must still reach its target.
  for _i, _t in enumerate(TOOL_PATH):
      assert np.linalg.norm(fk(_traj[_i]) - _t) < 1e-4, "waypoint %d does not reach its tool target" % _i

  # THE BUG: the joint trajectory must be as smooth as the task path.
  _steps = np.abs(np.diff(_traj, axis=0)).max(axis=1)
  assert _steps.max() < 0.35, "the joint trajectory jumps %.2f rad (%.0f deg) in a single waypoint while the tool moves less than 5 cm. IK is a relation, not a function — solving each waypoint from the same fixed seed lets the solver land in a different branch, and the arm flips configuration to get there." % (_steps.max(), np.degrees(_steps.max()))

  # It must start where it was told to.
  assert np.linalg.norm(_traj[0] - Q_START) < 0.05, "the arm is already at Q_START and that is a valid solution for the first waypoint, so the trajectory should begin there — not wherever a fixed seed happens to converge"

  # And the whole trajectory should stay on one branch: the elbow sign
  # (joint 1) must not change sign partway through.
  _elbow = np.sign(_traj[:, 1])
  _flips = int(np.sum(np.abs(np.diff(_elbow)) > 0))
  assert _flips == 0, "the elbow changes sign %d time(s) along the path — that is the configuration flip, and it is fast and loud on hardware" % _flips
hints:
  - "Compare the two numbers the probe prints. The tool moves under 5 cm between waypoints; the joints jump by more than a radian at one of them. Nothing about the task is discontinuous."
  - "A tool pose has several joint solutions — elbow up and elbow down both reach it. Seeding every solve from the same fixed configuration lets the solver pick whichever basin that seed happens to fall into, and which one that is changes as the target moves."
  - "Warm-start: seed each solve from the PREVIOUS solution. That keeps you on one continuous branch, which is exactly the continuity the hardware needs."
solution: |
  import numpy as np

  def follow_path(tool_path, q_start=Q_START):
      out = []
      # Warm-start from the previous solution. IK is a relation, so the seed
      # is what selects a branch — and keeping the same branch is the whole
      # difference between a smooth trajectory and a configuration flip.
      q = np.asarray(q_start, dtype=float).copy()
      for target in tool_path:
          q = solve_ik(target, q)
          out.append(q.copy())
      return np.array(out)

  traj = follow_path(TOOL_PATH)
  steps = np.abs(np.diff(traj, axis=0)).max(axis=1)
  print("tool path is smooth   : max step %.5f m"
        % np.abs(np.diff(TOOL_PATH, axis=0)).max())
  print("joint path max step   : %.3f rad (%.0f deg)"
        % (steps.max(), np.degrees(steps.max())))
  print("worst waypoint        : %d of %d" % (int(np.argmax(steps)), len(traj)))
