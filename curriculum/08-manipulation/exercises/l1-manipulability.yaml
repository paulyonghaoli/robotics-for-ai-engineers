      return 0.0

  def joint_speed_for(q, task_velocity, damping=0.0):
      """Norm of the joint velocity needed to move the tool at
      `task_velocity` (2,) from configuration q.

      Note which direction is expensive: for a nearly-straight arm along +x,
      every Jacobian column points along +y, so swinging the tool sideways is
      cheap and pushing it further OUT is what the arm cannot do.

      Use damped least squares:
          dq = J.T @ solve(J @ J.T + damping^2 * I, v)
      With damping = 0 that is the plain pseudo-inverse.

      Near a singularity the motion is still achievable and merely ruinous,
      and that finite-but-enormous number is what you are here to observe —
      do not add a fallback that hides it. (AT an exact singularity the
      velocity is unachievable and the solve is undefined; every
      configuration used here is near-singular, not singular.)
      """
