id: man-l1-manipulability
title: "Where the arm is about to become useless"
lesson: modules/08-manipulation/01-kinematics
description: >-
  Manipulability condenses the Jacobian's conditioning into one number, and
  it is zero exactly at a singularity. Compute it, then use it to price a
  task-space path: a perfectly ordinary straight line between two ordinary
  poses can demand joint velocities an order of magnitude larger in the
  middle than at either end.
setup_code: |
  import numpy as np

  LINKS = np.array([1.0, 0.8, 0.6])

  def joint_positions(q, links=LINKS):
      q = np.asarray(q, dtype=float)
      ang = np.cumsum(q)
      seg = np.stack([links * np.cos(ang), links * np.sin(ang)], axis=1)
      return np.vstack([np.zeros(2), np.cumsum(seg, axis=0)])

  def fk(q, links=LINKS):
      return joint_positions(q, links)[-1]

  def jacobian(q, links=LINKS):
      pts = joint_positions(q, links)
      d = pts[-1] - pts[:-1]
      return np.stack([-d[:, 1], d[:, 0]])
starter_code: |
  import numpy as np
  # Provided: LINKS, joint_positions(q), fk(q) -> (x,y), jacobian(q) -> (2,n)

  def manipulability(q):
      """Yoshikawa's measure: sqrt(det(J @ J.T)).

      Zero exactly when the arm has lost a direction of motion.
