id: dat-l1-index
title: "An inverted index over a fleet archive"
lesson: modules/12-data-infra/01-indexing
description: >-
  Build the index and the query. Two details decide whether it is usable at
  fleet scale: numeric attributes have to be bucketed before they are keys,
  because exact float equality never matches; and a conjunctive query should
  intersect the most selective term first, so the cheapest term bounds the
  work rather than the most common one.
setup_code: |
  import numpy as np

  def make_archive(n=4000, seed=0):
      """A synthetic fleet archive: one record per episode."""
      rng = np.random.default_rng(seed)
      weather = rng.choice(["clear", "rain", "fog"], n, p=[0.75, 0.20, 0.05])
      site = rng.choice(["depot-a", "depot-b", "yard"], n, p=[0.5, 0.35, 0.15])
      version = rng.choice(["v7", "v8"], n, p=[0.3, 0.7])
      speed = rng.uniform(0.2, 2.4, n)
      # Collisions are rare, and rarer still in clear weather.
      p_coll = np.where(weather == "clear", 0.02, 0.12)
      outcome = np.where(rng.random(n) < p_coll, "collision", "success")
      return [{"id": i, "weather": str(weather[i]), "site": str(site[i]),
               "version": str(version[i]), "speed": float(speed[i]),
               "outcome": str(outcome[i])} for i in range(n)]

  ARCHIVE = make_archive()
