id: dat-l2-divergence
title: "Why 'close enough' is not a category"
lesson: modules/12-data-infra/02-replay-determinism
description: >-
  Two replays of the same episode that differ by one part in a trillion.
  In a batch pipeline that is noise. In a closed loop it is a countdown —
  the difference is an action, which is a state, which is an observation,
  and it compounds. Measure how long "identical to twelve decimal places"
  survives, then decide what your comparison tolerance should be.
setup_code: |
  import numpy as np

  DT = 0.1
  LANE = 1.0

  def controller(y, gain=0.2):
      """Steer back toward the centre line — under-gained for this road."""
      return -gain * y

  def plant(y, action, camber=0.7):
      """The road slopes away from centre faster than the controller pulls
      back, so the closed loop grows by about 5% per step:

          y_next = y * (1 + (camber - gain) * DT) = y * 1.05

      A gently unstable loop, which is all it takes."""
      return y + (action + camber * y) * DT

  def run(y0, steps=600):
      """A deterministic episode. Same input, same output, always."""
      y, traj = float(y0), []
      for _ in range(steps):
          y = plant(y, controller(y))
          traj.append(y)
      return np.array(traj)
