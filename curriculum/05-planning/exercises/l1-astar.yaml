tests: |
  import numpy as np
  _g = np.zeros((10, 10), dtype=bool)
  _p = astar(_g, (0, 0), (0, 9))
  assert _p is not None and _p[0] == (0, 0) and _p[-1] == (0, 9), "endpoints must be included"
  assert abs(path_length(_p) - 9.0) < 1e-9, "open-row path should have length 9"
  _p = astar(_g, (0, 0), (9, 9))
  assert abs(path_length(_p) - 9 * np.sqrt(2)) < 1e-9, "pure diagonal should cost 9*sqrt(2) — is your diagonal step cost sqrt(2), not 1?"
  _g2 = np.zeros((10, 10), dtype=bool); _g2[0:9, 5] = True
  _p = astar(_g2, (4, 0), (4, 9))
  assert _p is not None and all(not _g2[c] for c in _p), "path must detour around the wall, never through it"
  assert path_length(_p) > 10.0, "the detour must be longer than the straight line"
  _g3 = np.zeros((10, 10), dtype=bool); _g3[:, 5] = True
  assert astar(_g3, (4, 0), (4, 9)) is None, "a full wall means no path: return None"
hints:
  - "Skeleton: g = {start: 0}; heap = [(octile(start, goal), 0, start)]; pop the lowest f; if it's the goal, walk parents back; else relax all free neighbors with cand = g[cur] + cost."
  - "Push a tie-breaking counter as the tuple's second element so cells never get compared. Skip popped cells already in the closed set."
solution: |
  import heapq
  import numpy as np

  def octile(a, b):
      dy, dx = abs(a[0]-b[0]), abs(a[1]-b[1])
      return (dy + dx) + (SQRT2 - 2.0) * min(dy, dx)

  def astar(grid, start, goal):
      rows, cols = grid.shape
      if grid[start] or grid[goal]:
          return None
      g = {start: 0.0}
      parent = {}
      heap = [(octile(start, goal), 0, start)]
      tie = 0
      closed = set()
      while heap:
          _, _, cur = heapq.heappop(heap)
          if cur in closed:
              continue
          if cur == goal:
              path = [cur]
              while cur in parent:
                  cur = parent[cur]
                  path.append(cur)
              return path[::-1]
          closed.add(cur)
          for dy, dx, cost in NEIGHBORS:
              ny, nx = cur[0]+dy, cur[1]+dx
              if not (0 <= ny < rows and 0 <= nx < cols) or grid[ny, nx]:
                  continue
              cand = g[cur] + cost
              if cand < g.get((ny, nx), np.inf):
                  g[(ny, nx)] = cand
                  parent[(ny, nx)] = cur
                  tie += 1
                  heapq.heappush(heap, (cand + octile((ny, nx), goal), tie, (ny, nx)))
      return None

  g = np.zeros((10, 10), dtype=bool)
  g[0:9, 5] = True
  print(path_length(astar(g, (4, 0), (4, 9))))
