id: plan-l6-freezing
title: "Case 2: the robot that won't go through the door"
lesson: modules/05-planning/06-lab-planner-pathologies
description: >-
  A DWA local planner refuses a 1.4 m gap that a 0.5 m-wide robot fits
  through with room to spare. Every parameter looks defensible on its own.
  **Run** to watch it stall, find the one that isn't, and fix it without
  switching off collision safety.
setup_code: |
  import numpy as np

  DT, HORIZON = 0.2, 6
  ROBOT_R = 0.25
  V_MAX, W_MAX = 0.8, 1.2
  GOAL = np.array([9.0, 5.0])
  # A doorway: two wall stubs leaving a 1.4 m gap centred on y = 5.
  _wy1 = np.linspace(0.0, 4.3, 40)
  _wy2 = np.linspace(5.7, 10.0, 40)
  OBSTACLES = np.vstack([
      np.column_stack([np.full_like(_wy1, 5.0), _wy1]),
      np.column_stack([np.full_like(_wy2, 5.0), _wy2]),
  ])

  def rollout(pose, v, w):
      x, y, th = pose
      pts = []
      for _ in range(HORIZON):
          if abs(w) < 1e-9:
              x += v * np.cos(th) * DT; y += v * np.sin(th) * DT
          else:
              r = v / w
              x += r * (np.sin(th + w * DT) - np.sin(th))
              y -= r * (np.cos(th + w * DT) - np.cos(th)); th += w * DT
          pts.append((x, y))
      return np.array(pts)

  def simulate(controller, steps=200):
      pose = np.array([2.0, 5.0, 0.0])
      v = w = 0.0
      traj = []
      for _ in range(steps):
          v, w = controller(pose, v, w)
          pts = rollout(pose, v, w)
          nx, ny = pts[0]
          th = pose[2] + w * DT
          pose = np.array([nx, ny, th])
          traj.append(pose.copy())
          if np.linalg.norm(pose[:2] - GOAL) < 0.4:
              break
      traj = np.array(traj)
      clearances = [np.linalg.norm(OBSTACLES - p[:2], axis=1).min() for p in traj]
      return traj, float(np.linalg.norm(traj[-1, :2] - GOAL)), float(min(clearances))
starter_code: |
  import numpy as np
  # Provided: OBSTACLES (a wall with a 1.4 m gap at y=5), rollout(pose, v, w),
  #           simulate(controller), ROBOT_R = 0.25, V_MAX = 0.8, W_MAX = 1.2.

  # Three parameters. Exactly one of them is wrong.
  SAFE_MARGIN = 0.75      # required clearance for an arc to be admissible (m)
  W_CLEARANCE = 0.5       # weight on clearance in the score
  W_PROGRESS  = 2.0       # weight on progress toward the goal

  def dwa(pose, v_c, w_c):
      vs = np.linspace(0.0, V_MAX, 5)
      ws = np.linspace(-W_MAX, W_MAX, 9)
      best, best_score = (0.0, 0.0), -np.inf
      d0 = np.linalg.norm(pose[:2] - GOAL)
      for v in vs:
          for w in ws:
              pts = rollout(pose, v, w)
              clear = min(np.linalg.norm(OBSTACLES - p, axis=1).min() for p in pts)
              if clear < SAFE_MARGIN:
                  continue
              progress = d0 - np.linalg.norm(pts[-1] - GOAL)
              score = W_PROGRESS * progress + W_CLEARANCE * clear
              if score > best_score:
                  best_score, best = score, (float(v), float(w))
      return best

  traj, final, min_clear = simulate(dwa)
  print("final distance: %.2f   min clearance: %.2f m" % (final, min_clear))
tests: |
  import numpy as np
  _traj, _final, _min_clear = simulate(dwa)
  assert _final < 0.4, "the robot must get through the doorway to the goal (final distance %.2f) - it fits, so if it stalls the planner is refusing, not colliding" % _final
  assert _min_clear > ROBOT_R, "it must never actually touch the wall (min clearance %.2f vs robot radius %.2f)" % (_min_clear, ROBOT_R)
  assert SAFE_MARGIN > ROBOT_R, "do NOT fix this by disabling safety: the admissibility margin must still exceed the robot radius (got %.2f)" % SAFE_MARGIN
  assert SAFE_MARGIN < 0.7, "the margin must be physically achievable in a 1.4 m gap (half-gap is 0.7 m)"
  assert W_CLEARANCE >= 0.0 and W_PROGRESS > 0.0, "keep both score terms sane"
hints:
  - "Diagnose first: the gap is 1.4 m wide, so passing through its centre gives at most 0.7 m clearance to each side. Which parameter is asking for more than the world can supply?"
  - "The best any path can do is the centre line, which clears exactly 0.70 m to each stub. SAFE_MARGIN = 0.75 asks for more than the doorway physically contains, so EVERY arc is inadmissible and the planner correctly selects (0, 0) — forever. Lower it under 0.70 (0.4 works) while keeping it above ROBOT_R = 0.25."
  - "Note what the tests refuse to accept: setting SAFE_MARGIN below the robot radius. Freezing is fixed by making the margin *achievable*, not by removing safety."
solution: |
  import numpy as np

  SAFE_MARGIN = 0.40      # was 0.75 - unachievable in a 1.4 m gap
  W_CLEARANCE = 0.5
  W_PROGRESS  = 2.0

  def dwa(pose, v_c, w_c):
      vs = np.linspace(0.0, V_MAX, 5)
      ws = np.linspace(-W_MAX, W_MAX, 9)
      best, best_score = (0.0, 0.0), -np.inf
      d0 = np.linalg.norm(pose[:2] - GOAL)
      for v in vs:
          for w in ws:
              pts = rollout(pose, v, w)
              clear = min(np.linalg.norm(OBSTACLES - p, axis=1).min() for p in pts)
              if clear < SAFE_MARGIN:
                  continue
              progress = d0 - np.linalg.norm(pts[-1] - GOAL)
              score = W_PROGRESS * progress + W_CLEARANCE * clear
              if score > best_score:
                  best_score, best = score, (float(v), float(w))
      return best

  traj, final, min_clear = simulate(dwa)
  print("final distance: %.2f   min clearance: %.2f m" % (final, min_clear))
