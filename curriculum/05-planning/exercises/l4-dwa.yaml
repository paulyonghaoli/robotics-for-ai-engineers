tests: |
  import numpy as np
  _w = window(0.5, 0.0)
  _vs = sorted(set(round(v, 4) for v, _ in _w))
  assert min(_vs) >= 0.3 - 1e-6 and max(_vs) <= 0.7 + 1e-6, "window from v_c=0.5: reachable v is [0.3, 0.7] (accel 1.0 * dt 0.2)"
  _w2 = window(0.95, 0.0)
  assert max(v for v, _ in _w2) <= 1.0 + 1e-9, "window must clip at V_MAX"
  assert min(v for v, _ in window(0.05, 0.0)) >= 0.0, "window must clip at v >= 0"
  _s = score(np.array([3.8, 3.4, 0.0]), 1.0, 0.0)
  assert _s == -np.inf, "an arc driving straight into an obstacle must score -inf"
  _pose, _v, _wc = np.array([1.0, 5.0, 0.0]), 0.0, 0.0
  _min_clear = 1e9
  for _k in range(120):
      _v, _wc = dwa_step(_pose, _v, _wc)
      _pose = np.array(arc_rollout(_pose, _v, _wc)[0])
      _min_clear = min(_min_clear, clearance_of(_pose))
      if np.hypot(*(_pose[:2] - GOAL)) < 0.4:
          break
  assert np.hypot(*(_pose[:2] - GOAL)) < 0.4, "must reach the goal through the gap (final dist %.2f)" % np.hypot(*(_pose[:2] - GOAL))
  assert _min_clear > ROBOT_R - 1e-6, "the robot body must never touch an obstacle (min clearance %.2f)" % _min_clear
  assert _k < 110, "should arrive briskly, not creep (took %d steps)" % _k
hints:
  - "window: two np.linspace grids (7 and 9 points) over the clipped ranges; return all (v, w) pairs."
  - "score: pts = arc_rollout(...); if min clearance over pts < ROBOT_R return -inf; progress = dist(pose, GOAL) − dist(pts[-1], GOAL)."
  - "dwa_step: max(window(v_c, w_c), key=lambda vw: score(pose, *vw))."
solution: |
  import numpy as np

  def window(v_c, w_c):
      vs = np.linspace(max(0.0, v_c - A_V*DT), min(V_MAX, v_c + A_V*DT), 7)
      ws = np.linspace(max(-W_MAX, w_c - A_W*DT), min(W_MAX, w_c + A_W*DT), 9)
      return [(float(v), float(w)) for v in vs for w in ws]

  def score(pose, v, w):
      pts = arc_rollout(pose, v, w)
      clear = min(clearance_of(p) for p in pts)
      if clear < ROBOT_R:
          return -np.inf
      d0 = np.hypot(*(pose[:2] - GOAL))
      d1 = np.hypot(*(np.asarray(pts[-1][:2]) - GOAL))
      return 1.2 * (d0 - d1) + 0.4 * clear + 0.1 * v

  def dwa_step(pose, v_c, w_c):
      return max(window(v_c, w_c), key=lambda vw: score(pose, *vw))

  pose, v, w = np.array([1.0, 5.0, 0.0]), 0.0, 0.0
  for k in range(120):
      v, w = dwa_step(pose, v, w)
      pose = np.array(arc_rollout(pose, v, w)[0])
      if np.hypot(*(pose[:2] - GOAL)) < 0.4:
          break
  print("steps: %d  final dist: %.2f" % (k, np.hypot(*(pose[:2] - GOAL))))
