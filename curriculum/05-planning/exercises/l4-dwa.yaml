id: plan-l4-dwa
title: "Implement the dynamic window"
lesson: modules/05-planning/04-local-planning
description: >-
  Build DWA's three parts: the reachable velocity window, arc rollouts,
  and the progress/clearance/velocity score. Then drive a robot through a
  gap between two obstacles to a goal. Tests check the window math, that
  colliding arcs are discarded, and the closed-loop result: goal reached,
  nothing touched.
setup_code: |
  import numpy as np

  OBSTACLES = [(5.0, 3.4, 1.2), (5.0, 6.6, 1.2)]   # gap centered at y=5
  GOAL = np.array([9.0, 5.0])
  DT, HORIZON_STEPS = 0.2, 8
  V_MAX, W_MAX, A_V, A_W = 1.0, 1.5, 1.0, 2.0
  ROBOT_R = 0.25

  def clearance_of(p):
      return min(np.hypot(p[0]-cx, p[1]-cy) - r for cx, cy, r in OBSTACLES)

  def arc_rollout(pose, v, w):
      x, y, th = pose
      pts = []
      for _ in range(HORIZON_STEPS):
          if abs(w) < 1e-9:
              x += v*np.cos(th)*DT; y += v*np.sin(th)*DT
          else:
              r = v/w
              x += r*(np.sin(th+w*DT)-np.sin(th)); y -= r*(np.cos(th+w*DT)-np.cos(th)); th += w*DT
          pts.append((x, y, th))
      return pts
