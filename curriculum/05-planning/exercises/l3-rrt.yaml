tests: |
  import numpy as np
  _found = 0
  for _seed in range(5):
      _p = rrt(np.random.default_rng(_seed))
      if _p is None:
          continue
      _found += 1
      assert np.allclose(_p[0], START), "path must begin at START"
      assert np.hypot(*(np.asarray(_p[-1]) - GOAL)) < 1e-6, "path must end exactly at GOAL"
      for _a, _b in zip(_p, _p[1:]):
          assert segment_free(_a, _b), "every path segment must be collision-free at fine resolution"
          assert np.hypot(*(np.asarray(_b) - np.asarray(_a))) < STEP + GOAL_TOL + 1e-6, "segments must respect the steer step size"
  assert _found >= 4, "RRT should solve this scene on at least 4 of 5 seeds (got %d) - check goal bias and the steer step" % _found
hints:
  - "Nearest: `i = int(np.argmin([np.hypot(*(sample - n)) for n in nodes]))`."
  - "Steer: `d = sample - nodes[i]; L = np.hypot(*d); new = sample if L <= STEP else nodes[i] + STEP * d / L`."
  - "Path recovery: from the last-added index, follow `parents[]` to -1, collecting nodes; reverse."
solution: |
  import numpy as np

  STEP, GOAL_BIAS, MAX_ITERS, GOAL_TOL = 1.0, 0.08, 4000, 1.0

  def rrt(rng):
      nodes, parents = [START.copy()], [-1]
      for _ in range(MAX_ITERS):
          sample = GOAL.copy() if rng.random() < GOAL_BIAS else rng.uniform(0.0, 20.0, 2)
          i = int(np.argmin([np.hypot(*(sample - n)) for n in nodes]))
          d = sample - nodes[i]
          L = float(np.hypot(*d))
          if L < 1e-9:
              continue
          new = sample if L <= STEP else nodes[i] + STEP * d / L
          if not segment_free(nodes[i], new):
              continue
          nodes.append(new)
          parents.append(i)
          if np.hypot(*(new - GOAL)) < GOAL_TOL and segment_free(new, GOAL):
              nodes.append(GOAL.copy())
              parents.append(len(nodes) - 2)
              path, j = [], len(nodes) - 1
              while j != -1:
                  path.append(nodes[j])
                  j = parents[j]
              return path[::-1]
      return None

  path = rrt(np.random.default_rng(0))
  print("path nodes:", None if path is None else len(path))
