id: plan-l3-rrt
title: "Grow an RRT"
lesson: modules/05-planning/03-rrt
description: >-
  Implement the RRT loop — sample, nearest, steer, collision-check, connect
  — in a 20×20 m world with circular obstacles, plus goal bias. The tests
  check the path end-to-end, verify every segment is genuinely
  collision-free at fine resolution, and run multiple seeds (RRT's output
  is a random variable; one lucky run proves nothing).
setup_code: |
  import numpy as np

  OBSTACLES = [(10.0, 4.0, 2.0), (10.0, 10.0, 2.2), (10.0, 16.5, 2.0), (5.0, 8.0, 1.5)]
  START, GOAL = np.array([2.0, 2.0]), np.array([18.0, 18.0])

  def in_collision(p):
      return any(np.hypot(p[0]-cx, p[1]-cy) < r for cx, cy, r in OBSTACLES)

  def segment_free(a, b, step=0.05):
      """True if the straight segment from `a` to `b` misses every obstacle.

      Sampled every `step` metres, endpoints included. Checking only the
      endpoints is not the same thing.
      """
      a, b = np.asarray(a, float), np.asarray(b, float)
      n = max(2, int(np.hypot(*(b - a)) / step) + 1)
      for t in np.linspace(0.0, 1.0, n):
          if in_collision(a + t * (b - a)):
              return False
      return True
