id: ctl-l6-mpc
title: "Sampling MPC on a constrained cart"
lesson: modules/02-control/06-mpc
description: >-
  Implement receding-horizon control by sampling: roll out candidate input
  sequences through the model, score them, apply the best sequence's FIRST
  input, repeat. The cart must reach x = 2.0 fast — and a hard wall at
  x = 2.5 makes late braking fatal. PID slams the wall here; MPC sees it
  coming.
setup_code: |
  import numpy as np

  DT, U_MAX, WALL = 0.1, 1.0, 2.5

  def rollout(x, v, u_seq):
      """Simulate the double integrator; returns arrays of x and v."""
      xs, vs = [], []
      for u in u_seq:
          v = v + np.clip(u, -U_MAX, U_MAX) * DT
          x = x + v * DT
          xs.append(x); vs.append(v)
      return np.array(xs), np.array(vs)

  def run_closed_loop(controller, steps=120):
      """Run the double integrator in closed loop with your controller.

      `controller(x, v) -> acceleration`, clipped to +/-U_MAX. Returns shape
      (steps, 2), each row (position, velocity).
      """
      x, v, hist = 0.0, 0.0, []
      for _ in range(steps):
          u = float(np.clip(controller(x, v), -U_MAX, U_MAX))
          v = v + u * DT
          x = x + v * DT
          hist.append((x, v))
      return np.array(hist)
