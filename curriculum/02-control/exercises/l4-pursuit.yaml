id: ctl-l4-pursuit
title: "Implement pure pursuit"
lesson: modules/02-control/04-trajectory-tracking
description: >-
  Implement the pure-pursuit steering law and drive a simulated
  differential-drive robot back onto a path it starts 2 m away from. The
  tests grade the closed-loop behavior: convergence, staying converged,
  and steering the correct direction.
setup_code: |
  import numpy as np

  PATH = np.column_stack([np.linspace(0, 30, 301), np.zeros(301)])

  def body_frame(pose, point):
      """Express a world point in the robot's body frame."""
      x, y, th = pose
      d = np.asarray(point) - [x, y]
      c, s = np.cos(-th), np.sin(-th)
      return np.array([c * d[0] - s * d[1], s * d[0] + c * d[1]])

  def rollout(controller, pose, path, steps=300, v=1.0, dt=0.05):
      poses = []
      for _ in range(steps):
          w = float(np.clip(controller(np.array(pose), path), -2.5, 2.5))
          x, y, th = pose
          if abs(w) < 1e-9:
              pose = (x + v*np.cos(th)*dt, y + v*np.sin(th)*dt, th)
          else:
              r = v / w
              pose = (x + r*(np.sin(th + w*dt) - np.sin(th)),
                      y - r*(np.cos(th + w*dt) - np.cos(th)), th + w*dt)
          poses.append(pose)
      return np.array(poses)
