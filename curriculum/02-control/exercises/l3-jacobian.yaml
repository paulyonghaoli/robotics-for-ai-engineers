id: ctl-l3-jacobian
title: "The arm Jacobian and its singular values"
lesson: modules/02-control/03-jacobians
description: >-
  Build the 2-link arm's analytic Jacobian, validate it against finite
  differences, and trace the smallest singular value to find both singular
  configurations — where the manipulability ellipse collapses to a line.
setup_code: |
  import numpy as np
  L1, L2 = 1.0, 0.8

  def fk(theta):
      t1, t12 = theta[0], theta[0] + theta[1]
      return np.array([L1*np.cos(t1) + L2*np.cos(t12), L1*np.sin(t1) + L2*np.sin(t12)])

  def finite_diff_jac(theta, eps=1e-6):
      J = np.zeros((2, 2))
      for k in range(2):
          d = np.zeros(2); d[k] = eps
          J[:, k] = (fk(theta + d) - fk(theta - d)) / (2 * eps)
      return J
starter_code: |
  import numpy as np
  # Provided: fk(theta), finite_diff_jac(theta), L1 = 1.0, L2 = 0.8

  def jacobian(theta):
      """Analytic 2x2 Jacobian of fk wrt (theta1, theta2)."""
      # TODO — columns: hand velocity per unit joint velocity
      return np.eye(2)

  def sigma_min(theta):
      """Smallest singular value of J — the manipulability ellipse's short axis."""
      # TODO: np.linalg.svd(..., compute_uv=False)[-1]
      return 0.0

  print(jacobian(np.array([0.0, np.pi/2])))
  print("stretched:", sigma_min(np.array([0.3, 0.0])))   # ~0: singular
  print("elbow 90:", sigma_min(np.array([0.3, np.pi/2])))  # healthy
tests: |
  import numpy as np
  _rng = np.random.default_rng(4)
  for _ in range(15):
      _t = _rng.uniform(-np.pi, np.pi, 2)
      assert np.allclose(jacobian(_t), finite_diff_jac(_t), atol=1e-5), "analytic J must match finite differences at theta=%s" % np.round(_t, 2)
  assert sigma_min(np.array([0.3, 0.0])) < 0.05, "fully stretched (theta2=0) must be singular: sigma_min ~ 0"
  assert sigma_min(np.array([0.3, np.pi])) < 0.05, "fully folded (theta2=pi) is the OTHER singularity"
  assert sigma_min(np.array([0.3, np.pi/2])) > 0.4, "elbow at 90 degrees should be well-conditioned"
  _d = np.linalg.det(jacobian(np.array([0.5, np.pi/2])))
  assert abs(_d - L1*L2) < 1e-9, "det J = L1*L2*sin(theta2) should equal L1*L2 at theta2=pi/2"
hints:
  - "J = [[-L1·s1 − L2·s12, −L2·s12], [L1·c1 + L2·c12, L2·c12]] with s12 = sin(t1+t2) etc."
  - "sigma_min: `np.linalg.svd(jacobian(theta), compute_uv=False)[-1]` — singular values come sorted descending."
solution: |
  import numpy as np

  def jacobian(theta):
      t1, t12 = theta[0], theta[0] + theta[1]
      return np.array([
          [-L1*np.sin(t1) - L2*np.sin(t12), -L2*np.sin(t12)],
          [ L1*np.cos(t1) + L2*np.cos(t12),  L2*np.cos(t12)],
      ])

  def sigma_min(theta):
      return float(np.linalg.svd(jacobian(theta), compute_uv=False)[-1])

  print(jacobian(np.array([0.0, np.pi/2])))
  print("stretched:", sigma_min(np.array([0.3, 0.0])))
  print("elbow 90:", sigma_min(np.array([0.3, np.pi/2])))
