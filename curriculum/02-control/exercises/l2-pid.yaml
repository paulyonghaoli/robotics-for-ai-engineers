id: ctl-l2-pid
title: "Implement production PID"
lesson: modules/02-control/02-pid
description: >-
  Implement a PID class with the three production guards: output clamping,
  integral anti-windup, and no derivative kick on the first call. The tests
  are behavioral — steady-state error with P-only, its removal by I, and a
  saturation-recovery scenario that fails without anti-windup.
setup_code: |
  import numpy as np

  def run_first_order(pid, setpoint, steps=1500, dt=0.01, tau=1.0):
      """Drive a first-order plant with your controller and return its output.

      `pid` is any object with `update(error, dt) -> command`. Returns the
      measured value at every step, shape (steps,).
      """
      y, ys = 0.0, []
      for _ in range(steps):
          u = pid.update(setpoint - y, dt)
          y += (u - y) / tau * dt
          ys.append(y)
      return np.array(ys)
