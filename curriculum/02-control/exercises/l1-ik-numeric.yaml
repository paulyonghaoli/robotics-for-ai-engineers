id: ctl-l1-ik
title: "Numerical IK: damped least squares"
lesson: modules/02-control/01-kinematics
description: >-
  Implement the damped-least-squares IK iteration — the production default
  for arms without closed forms. The tests check convergence to reachable
  targets and, crucially, that damping keeps steps bounded near the
  singularity where the undamped pseudoinverse explodes.
setup_code: |
  import numpy as np
  L1, L2 = 1.0, 0.8

  def fk(theta):
      """Forward kinematics of the two-link planar arm.

      `theta` is (theta1, theta2) in radians; returns the (x, y) tip
      position in metres. Link lengths are L1 and L2.
      """
      t1, t12 = theta[0], theta[0] + theta[1]
      return np.array([L1*np.cos(t1) + L2*np.cos(t12), L1*np.sin(t1) + L2*np.sin(t12)])

  def jacobian(theta):
      """Analytic 2x2 Jacobian d(tip position) / d(joint angles).

      Row 0 is dx, row 1 is dy; column j is the derivative w.r.t. joint j.
      """
      t1, t12 = theta[0], theta[0] + theta[1]
      return np.array([
          [-L1*np.sin(t1) - L2*np.sin(t12), -L2*np.sin(t12)],
          [ L1*np.cos(t1) + L2*np.cos(t12),  L2*np.cos(t12)],
      ])
starter_code: |
  import numpy as np
  # Provided: fk(theta), jacobian(theta) for the 2-link arm (L1=1.0, L2=0.8)

  def ik_solve(target, theta0, lam=0.1, iters=200):
      """Damped-least-squares IK. Returns final theta (2,) array.

      Update: dtheta = J.T @ inv(J @ J.T + lam^2 I) @ error
      """
      theta = np.array(theta0, dtype=float)
      # TODO: iterate the DLS update
      return theta

  theta = ik_solve(np.array([1.2, 0.6]), theta0=[0.3, 0.3])
  print(theta, "->", fk(theta))   # fk(theta) should be ~[1.2, 0.6]
tests: |
  import numpy as np
  _t = ik_solve(np.array([1.2, 0.6]), theta0=[0.3, 0.3])
  assert np.allclose(fk(_t), [1.2, 0.6], atol=1e-3), "must converge to an easy interior target (residual %.4f)" % np.linalg.norm(fk(_t) - [1.2, 0.6])
  _t = ik_solve(np.array([-0.9, 0.9]), theta0=[1.0, 1.0])
  assert np.allclose(fk(_t), [-0.9, 0.9], atol=1e-3), "must converge in other quadrants too"
  _t0 = np.array([0.0, 0.0])  # exactly the stretched singularity
  _J = jacobian(_t0)
  _e = np.array([0.1, 0.0])   # radial error the arm cannot instantaneously produce
  _step = _J.T @ np.linalg.solve(_J @ _J.T + 0.1**2 * np.eye(2), _e)
  assert np.linalg.norm(_step) < 5.0, "sanity on the DLS formula at the singularity: step must stay bounded"
  _t = ik_solve(np.array([1.79, 0.0]), theta0=[0.2, 0.4], lam=0.1)
  assert np.isfinite(_t).all(), "near-boundary target must not produce NaN/inf"
  assert np.linalg.norm(fk(_t) - [1.79, 0.0]) < 0.05, "near-boundary target (|p|=1.79 of 1.8) should still be reached closely"
hints:
  - "Each iteration: e = target − fk(theta); J = jacobian(theta); theta += J.T @ np.linalg.solve(J @ J.T + lam²·I, e)."
  - "lam²·np.eye(2) is the damping — without it, J @ J.T is singular at full extension and solve() blows up."
solution: |
  import numpy as np

  def ik_solve(target, theta0, lam=0.1, iters=200):
      theta = np.array(theta0, dtype=float)
      for _ in range(iters):
          e = target - fk(theta)
          if np.linalg.norm(e) < 1e-10:
              break
          J = jacobian(theta)
          theta = theta + J.T @ np.linalg.solve(J @ J.T + lam**2 * np.eye(2), e)
      return theta

  theta = ik_solve(np.array([1.2, 0.6]), theta0=[0.3, 0.3])
  print(theta, "->", fk(theta))
