id: geo-l5-cspace
title: "Build a C-space obstacle map"
lesson: modules/01-geometry/05-configuration-space
description: >-
  Implement collision checking for a planar 2-link arm against circular
  workspace obstacles, then rasterize the C-space obstacle map on a grid
  over (θ₁, θ₂). The tests probe known colliding and free configurations
  and the map's occupancy fraction.
setup_code: |
  import numpy as np

  L1, L2 = 1.0, 0.8

  def arm_points(theta1, theta2, n=25):
      elbow = np.array([L1 * np.cos(theta1), L1 * np.sin(theta1)])
      hand = elbow + np.array([L2 * np.cos(theta1 + theta2), L2 * np.sin(theta1 + theta2)])
      t = np.linspace(0.0, 1.0, n)[:, None]
      return np.vstack([t * elbow, elbow + t * (hand - elbow)])
