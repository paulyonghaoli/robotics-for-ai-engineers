id: geo-l2-quat-compose
title: "Axis-angle quaternions and composition"
lesson: modules/01-geometry/02-quaternions
description: >-
  Implement `quat_from_axis_angle` (scalar-first `[w, x, y, z]`) and use the
  provided Hamilton product to verify a fact worth internalizing: two 90°
  rotations about z compose into one 180° rotation about z.
setup_code: |
  import numpy as np

  def quat_multiply(q1, q2):
      """Hamilton product of two quaternions, scalar-first [w, x, y, z].

      quat_multiply(a, b) applies b first, then a — the same order as
      matrix multiplication.
      """
      w1, x1, y1, z1 = q1
      w2, x2, y2, z2 = q2
      return np.array([
          w1*w2 - x1*x2 - y1*y2 - z1*z2,
          w1*x2 + x1*w2 + y1*z2 - z1*y2,
          w1*y2 - x1*z2 + y1*w2 + z1*x2,
          w1*z2 + x1*y2 - y1*x2 + z1*w2,
      ])

  def quat_rotate(q, v):
      """Rotate the 3-vector `v` by unit quaternion `q`. Returns a 3-vector."""
      qv = np.concatenate(([0.0], v))
      qc = q * np.array([1.0, -1.0, -1.0, -1.0])
      return quat_multiply(quat_multiply(q, qv), qc)[1:]
