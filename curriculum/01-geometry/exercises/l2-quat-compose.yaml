  def quat_from_axis_angle(axis, angle):
      """Unit quaternion for a rotation of `angle` radians about `axis`.

      `axis` need not be normalised. Returned scalar-first [w, x, y, z].
      """
      """Unit quaternion [w, x, y, z] for a rotation of `angle` about `axis`."""
      # TODO — remember the half-angle, and normalize the axis
      return np.array([1.0, 0.0, 0.0, 0.0])

  q90 = quat_from_axis_angle(np.array([0.0, 0.0, 1.0]), np.pi / 2)
  q180 = quat_multiply(q90, q90)

  print(q90)                                  # expect [0.7071, 0, 0, 0.7071]
  print(quat_rotate(q180, np.array([1.0, 0.0, 0.0])))  # expect [-1, 0, 0]
tests: |
  import numpy as np
  _q = quat_from_axis_angle(np.array([0.0, 0.0, 1.0]), np.pi / 2)
  assert abs(np.linalg.norm(_q) - 1.0) < 1e-9, "quaternion must be unit norm"
  assert abs(_q[0] - np.cos(np.pi / 4)) < 1e-9, "w component should be cos(theta/2) — did you use the half-angle?"
  _v = quat_rotate(_q, np.array([1.0, 0.0, 0.0]))
  assert np.allclose(_v, [0.0, 1.0, 0.0], atol=1e-9), "90 deg about z should take (1,0,0) to (0,1,0)"
  _q2 = quat_from_axis_angle(np.array([0.0, 0.0, 2.0]), np.pi / 2)
  assert np.allclose(_q2, _q, atol=1e-9), "axis must be normalized before use (axis [0,0,2] == axis [0,0,1])"
  _v2 = quat_rotate(quat_multiply(_q, _q), np.array([1.0, 0.0, 0.0]))
  assert np.allclose(_v2, [-1.0, 0.0, 0.0], atol=1e-9), "two 90 deg rotations should compose to 180 deg: (1,0,0) -> (-1,0,0)"
hints:
  - "q = [cos(θ/2), sin(θ/2)·n̂] — the half-angle is the classic mistake."
  - "Normalize: `axis = axis / np.linalg.norm(axis)` before scaling by sin(θ/2)."
solution: |
  import numpy as np

  def quat_from_axis_angle(axis, angle):
      """Unit quaternion for a rotation of `angle` radians about `axis`.

      `axis` need not be normalised. Returned scalar-first [w, x, y, z].
      """
      axis = np.asarray(axis, dtype=float)
      axis = axis / np.linalg.norm(axis)
      half = 0.5 * angle
      return np.concatenate(([np.cos(half)], np.sin(half) * axis))

  q90 = quat_from_axis_angle(np.array([0.0, 0.0, 1.0]), np.pi / 2)
  q180 = quat_multiply(q90, q90)
  print(q90)
  print(quat_rotate(q180, np.array([1.0, 0.0, 0.0])))
