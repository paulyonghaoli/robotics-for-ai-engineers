tests: |
  import numpy as np
  _T = lookup(tree, "map", "lidar")
  assert np.allclose(_T[:2, 2], [6.0, 2.5], atol=1e-9), "map<-lidar translation should be (6.0, 2.5)"
  _r = lookup(tree, "lidar", "map") @ lookup(tree, "map", "lidar")
  assert np.allclose(_r, np.eye(3), atol=1e-9), "lookup(a,b) must be the inverse of lookup(b,a)"
  _s = lookup(tree, "lidar", "camera")
  assert np.allclose(_s[:2, 2], [-0.3, 0.1], atol=1e-9), "sibling lookup must route through the common ancestor `base`"
  _c = lookup(tree, "map", "base") @ lookup(tree, "base", "camera")
  assert np.allclose(_c, lookup(tree, "map", "camera"), atol=1e-9), "consistency: lookup(map,camera) must equal lookup(map,base) @ lookup(base,camera)"
hints:
  - "The common ancestor is the first frame in path_to_root(source) that also appears in path_to_root(target)."
  - "Going up from a frame f: T_anc_f = T_edge(last) @ ... @ T_edge(first) — prepend each parent edge: `T = tree[f][1] @ T` while walking up."
  - "Edges walked up from *target* end up inverted once: T_target_source = inverse(T_anc_target) @ T_anc_source."
solution: |
  import numpy as np

  def path_to_root(tree, frame):
      path = [frame]
      while path[-1] in tree:
          path.append(tree[path[-1]][0])
      return path

  def lookup(tree, target, source):
      up_t, up_s = path_to_root(tree, target), path_to_root(tree, source)
      common = next(f for f in up_s if f in up_t)
      T_cs = np.eye(3)
      for f in up_s[: up_s.index(common)]:
          T_cs = tree[f][1] @ T_cs
      T_ct = np.eye(3)
      for f in up_t[: up_t.index(common)]:
          T_ct = tree[f][1] @ T_ct
      return se2_inverse(T_ct) @ T_cs

  tree = {
      "odom":   ("map",  se2(5.0, 0.0, 0.0)),
      "base":   ("odom", se2(1.0, 2.0, np.pi / 2)),
      "lidar":  ("base", se2(0.5, 0.0, 0.0)),
      "camera": ("base", se2(0.2, 0.1, 0.0)),
  }
  T = lookup(tree, "map", "lidar")
  print(T[:2, 2])
