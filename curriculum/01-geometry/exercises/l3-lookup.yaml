id: geo-l3-lookup
title: "Implement transform-tree lookup"
lesson: modules/01-geometry/03-transform-trees
description: >-
  Given a tree stored as `{child: (parent, T_parent_child)}`, implement
  `lookup(tree, target, source)` returning `T_target_source` by composing
  edges through the lowest common ancestor. This is the heart of TF2.
setup_code: |
  import numpy as np

  def se2(x, y, theta):
      """Pose (x, y, theta) as a 3x3 homogeneous SE(2) transform.

      Composes left-to-right: se2(*a) @ se2(*b) is a then b. Angles in
      radians, translation in metres.
      """
      c, s = np.cos(theta), np.sin(theta)
      return np.array([[c, -s, x], [s, c, y], [0, 0, 1.0]])

  def se2_inverse(T):
      """Invert an SE(2) transform: se2_inverse(T_a_b) is T_b_a."""
      R, t = T[:2, :2], T[:2, 2]
      Ti = np.eye(3)
      Ti[:2, :2] = R.T
      Ti[:2, 2] = -R.T @ t
      return Ti
