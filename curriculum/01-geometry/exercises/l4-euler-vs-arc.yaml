id: geo-l4-euler-vs-arc
title: "Twist integration: exact arc model"
lesson: modules/01-geometry/04-twists
description: >-
  Implement the exact (arc) integration of a constant body twist — with the
  ω ≈ 0 guard — and see it beat Euler integration on a closed circle. The
  tests drive one full revolution and check the trajectory closes.
setup_code: |
  import numpy as np

  def euler_step(pose, v, omega, dt):
      x, y, th = pose
      return (x + v * np.cos(th) * dt, y + v * np.sin(th) * dt, th + omega * dt)
