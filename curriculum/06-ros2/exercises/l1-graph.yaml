id: ros-l1-graph
title: "Topic, service, or action — and what the wrong answer costs"
lesson: modules/06-ros2/01-node-graph
description: >-
  Six interactions from a real robot. Three of the choices are obvious and
  three are the ones people get wrong, so work out the rule from measurable
  properties rather than from intuition — and then measure what one wrong
  choice does to a 50 Hz control loop.
setup_code: |
  # Every interaction between two nodes, with the properties you can
  # actually measure before deciding how to implement it.
  #
  #   hz              how often it happens (0.0 = on demand, rarely)
  #   needs_response  does the caller need something back?
  #   duration_ms     how long the work takes on the far side
  #   cancellable     would anyone ever want to abort it mid-flight?
  #   bytes           payload size, one message
  INTERACTIONS = {
      "lidar_scan":  {"hz": 10.0,  "needs_response": False, "duration_ms": 0.0,
                      "cancellable": False, "bytes": 46_000},
      "camera_raw":  {"hz": 30.0,  "needs_response": False, "duration_ms": 0.0,
                      "cancellable": False, "bytes": 921_600},
      "cmd_vel":     {"hz": 50.0,  "needs_response": False, "duration_ms": 0.0,
                      "cancellable": False, "bytes": 48},
      "set_gain":    {"hz": 0.0,   "needs_response": True,  "duration_ms": 2.0,
                      "cancellable": False, "bytes": 16},
      "get_map":     {"hz": 0.05,  "needs_response": True,  "duration_ms": 45.0,
                      "cancellable": False, "bytes": 1_000_000},
      "navigate_to": {"hz": 0.01,  "needs_response": True,  "duration_ms": 4000.0,
                      "cancellable": True,  "bytes": 64},
      "dock":        {"hz": 0.0,   "needs_response": True,  "duration_ms": 25_000.0,
                      "cancellable": True,  "bytes": 8},
  }

  LONG_MS = 1000.0          # past this, a caller should not be made to wait
  GOAL_SUBMIT_MS = 1.0      # cost of handing an action server a goal

  CONTROL_PERIOD_MS = 20.0  # a 50 Hz control loop
  CONTROL_WORK_MS = 4.0     # what the callback does on its own
