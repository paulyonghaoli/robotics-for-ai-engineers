id: ros-l2-qos
title: "The subscriber that never receives anything"
lesson: modules/06-ros2/02-qos
description: >-
  Seven endpoints, three topics, and two subscribers that will never receive
  a single message — with no error, no warning, and both nodes reporting
  healthy. Implement the compatibility rules, find them, and then work out
  what queue depth actually buys you on a stream you cannot keep up with.
setup_code: |
  # Quality of Service is a CONTRACT. A publisher OFFERS a level of service
  # and a subscriber REQUESTS one; the connection is made only if the offer
  # is at least as strong as the request. Nothing is negotiated down, and
  # nothing is reported when it fails.

  # Stronger is higher. A publisher can always over-deliver.
  RELIABILITY_RANK = {"best_effort": 0, "reliable": 1}
  DURABILITY_RANK = {"volatile": 0, "transient_local": 1}

  def endpoint(role, topic, reliability="reliable", durability="volatile",
               depth=10, deadline_ms=None):
      return {"role": role, "topic": topic, "reliability": reliability,
              "durability": durability, "depth": depth, "deadline_ms": deadline_ms}

  ENDPOINTS = {
      # A lidar driver, publishing sensor data the way sensor data is
      # normally published: fast, lossy, shallow queue.
      "lidar_driver": endpoint("pub", "/scan", "best_effort", "volatile", 5, 150.0),
      "slam_node":    endpoint("sub", "/scan", "reliable", "volatile", 10, 200.0),
      "rviz":         endpoint("sub", "/scan", "best_effort", "volatile", 5, 200.0),

      # A map server. The map is published once and must still be there for
      # a node that starts an hour later.
      "map_server":   endpoint("pub", "/map", "reliable", "transient_local", 1, None),
      "late_planner": endpoint("sub", "/map", "reliable", "transient_local", 1, None),
      "logger":       endpoint("sub", "/map", "reliable", "volatile", 1, None),

      # Velocity commands, with a deadline on both sides.
      "controller":   endpoint("pub", "/cmd_vel", "reliable", "volatile", 1, 25.0),
      "base_driver":  endpoint("sub", "/cmd_vel", "reliable", "volatile", 1, 20.0),
  }

  # The camera stream from lesson 6.1, and a subscriber that is too slow.
  CAMERA_HZ = 30.0
  DETECTOR_MS = 60.0
