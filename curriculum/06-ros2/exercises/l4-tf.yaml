tests: |
  import math
  _B = TF_BUFFER
  _newest = _B[-1]["t"]

  # 1. The three answers a lookup can give.
  assert window(_B, 8.0) == "ok"
  assert window(_B, _newest + 0.5) == "future", (
      "a transform for a time you have not received yet is not an error in "
      "your code — it is a request that has to wait, or fail")
  assert window(_B, _newest - BUFFER_S - 0.5) == "past", (
      "older than the cache keeps: that transform is gone and no amount of "
      "waiting brings it back")
  assert window(_B, 1.0) == "past", (
      "the buffer spans 12 s and keeps 10, so t=1.0 has already fallen out — "
      "a bag replayed slowly, or a detector that fell 15 s behind, hits this")

  # 2. Interpolation between samples, not nearest-neighbour.
  _mid = lookup_at(_B, 8.010)          # exactly between two 50 Hz samples
  _a, _b = lookup_at(_B, 8.000), lookup_at(_B, 8.020)
  assert abs(_mid["x"] - 0.5 * (_a["x"] + _b["x"])) < 1e-9, (
      "the lookup must interpolate; snapping to the nearest sample throws away "
      "half a period of motion for free")
  assert abs(_mid["yaw"] - W * 8.010) < 1e-6
  assert lookup_at(_B, _newest + 1.0) is None, "an unanswerable lookup returns None"

  assert abs(lookup_latest(_B)["t"] - _newest) < 1e-12

  # 3. transform_point, checked against a case you can do in your head.
  _px, _py = transform_point({"x": 1.0, "y": 2.0, "yaw": math.pi / 2}, 3.0, 0.0)
  assert abs(_px - 1.0) < 1e-9 and abs(_py - 5.0) < 1e-9, (
      "3 m ahead of a pose facing +y at (1, 2) is (1, 5), got (%.2f, %.2f)"
      % (_px, _py))

  # 4. THE CHECK. What `Time(0)` costs, by range.
  _t_now = T_CAPTURE + PROCESS_MS / 1000.0
  _e0 = stale_error_m(_B, T_CAPTURE, _t_now, 0.0)
  _e10 = stale_error_m(_B, T_CAPTURE, _t_now, 10.0)

  assert abs(_e0 - 0.12) < 0.005, (
      "at the sensor itself the error is how far the robot drove in 80 ms: "
      "1.5 m/s x 0.08 s = 0.12 m, got %.3f" % _e0)
  assert 0.60 < _e10 < 0.72, (
      "a detection 10 m away lands %.3f m from the obstacle — five times the "
      "error at the sensor" % _e10)
  assert _e10 > 5.0 * _e0, (
      "the error is dominated by the ROTATION, not the translation: 0.064 rad "
      "of yaw over 80 ms is 0.64 m at 10 m of range against 0.12 m of driving. "
      "Which is why this is worse for a lidar than for a bumper.")

  # It grows with range, without limit.
  _errs = [stale_error_m(_B, T_CAPTURE, _t_now, r) for r in (0.0, 5.0, 10.0, 20.0)]
  assert _errs == sorted(_errs), "further away is further wrong"
  assert _errs[-1] > 1.2, "at 20 m it is %.2f m" % _errs[-1]

  # And it is zero if you ask for the right time, which is the entire fix.
  assert stale_error_m(_B, T_CAPTURE, T_CAPTURE, 10.0) == 0.0, (
      "looking the transform up AT THE MESSAGE'S TIMESTAMP costs one argument "
      "and removes the whole error")

  # 5. The latency you can actually afford.
  _near = max_latency_ms(_B, T_CAPTURE, 1.0, 0.10)
  _far = max_latency_ms(_B, T_CAPTURE, 10.0, 0.10)
  assert 40.0 < _near < 60.0, "at 1 m, about 58 ms for 10 cm, got %.0f" % _near
  assert 8.0 < _far < 14.0, (
      "at 10 m you have about 12 ms, got %.0f — less than one control period, "
      "so on this robot `Time(0)` is not a shortcut with a small cost, it is "
      "unusable at range" % _far)
  assert _near > 3.0 * _far, "the affordable latency shrinks as range grows"
hints:
  - "window: compare `t` against the newest sample's time and against `newest - buffer_s`. Newer than the newest is 'future'; older than the cutoff is 'past'."
  - "lookup_at: find the two samples bracketing `t`, compute `alpha = (t - t0) / (t1 - t0)`, and blend x, y and yaw linearly. Return None when `window` is not 'ok'."
  - "transform_point: the standard 2D rotation then translation — `x + px*cos(yaw) - py*sin(yaw)`, `y + px*sin(yaw) + py*cos(yaw)`."
  - "stale_error_m: transform the same sensor-frame point through `lookup_at(buffer, t_capture)` and through `lookup_at(buffer, t_now)`, and return the distance between the results. max_latency_ms: step the latency up from 1 ms until the error exceeds the tolerance, and return the last value that did not."
solution: |
  import math

  def window(buffer, t, buffer_s=BUFFER_S):
      newest = buffer[-1]["t"]
      if t > newest:
          # Not an error: the transform simply has not been published yet.
          return "future"
      if t < newest - buffer_s:
          # Gone. The cache dropped it and nothing brings it back.
          return "past"
      return "ok"

  def lookup_at(buffer, t):
      if window(buffer, t) != "ok":
          return None
      # Bracketing samples, then a straight blend.
      for i in range(len(buffer) - 1):
          a, b = buffer[i], buffer[i + 1]
          if a["t"] <= t <= b["t"]:
              span = b["t"] - a["t"]
              alpha = 0.0 if span == 0 else (t - a["t"]) / span
              return {
                  "x": a["x"] + alpha * (b["x"] - a["x"]),
                  "y": a["y"] + alpha * (b["y"] - a["y"]),
                  "yaw": a["yaw"] + alpha * (b["yaw"] - a["yaw"]),
              }
      last = buffer[-1]
      return {"x": last["x"], "y": last["y"], "yaw": last["yaw"]}

  def lookup_latest(buffer):
      return dict(buffer[-1])

  def transform_point(pose, px, py):
      c, s = math.cos(pose["yaw"]), math.sin(pose["yaw"])
      return (pose["x"] + px * c - py * s,
              pose["y"] + px * s + py * c)

  def stale_error_m(buffer, t_capture, t_now, range_m):
      correct = lookup_at(buffer, t_capture)
      latest = lookup_at(buffer, t_now)
      if correct is None or latest is None:
          return float("inf")
      ax, ay = transform_point(correct, range_m, 0.0)
      bx, by = transform_point(latest, range_m, 0.0)
      return math.hypot(ax - bx, ay - by)

  def max_latency_ms(buffer, t_capture, range_m, tol_m):
      best = 0.0
      for ms in range(1, 1001):
          e = stale_error_m(buffer, t_capture, t_capture + ms / 1000.0, range_m)
          if e > tol_m:
              return best
          best = float(ms)
      return 1000.0

  _t_now = T_CAPTURE + PROCESS_MS / 1000.0
  print("scan captured at %.3f s, transformed at %.3f s\n" % (T_CAPTURE, _t_now))
  for _r in (0.0, 1.0, 5.0, 10.0, 20.0):
      print("  a detection %5.1f m away lands %6.3f m from where it is" % (
          _r, stale_error_m(TF_BUFFER, T_CAPTURE, _t_now, _r)))
  print()
  for _r in (1.0, 10.0):
      print("  at %4.1f m you can afford %5.1f ms of latency for 10 cm of error" % (
          _r, max_latency_ms(TF_BUFFER, T_CAPTURE, _r, 0.10)))
