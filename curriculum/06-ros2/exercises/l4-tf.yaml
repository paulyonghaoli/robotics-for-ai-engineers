id: ros-l4-tf
title: "The transform you asked for, at the time you didn't"
lesson: modules/06-ros2/04-tf2
description: >-
  A transform buffer, a scan captured 80 ms ago, and the one-argument
  difference between a detection that lands on the obstacle and one that
  lands most of a metre away from it. Then work out how much processing
  latency you can actually afford at range.
setup_code: |
  import math

  # odom -> base_link, published at 50 Hz for 12 seconds while the robot
  # drives a constant arc: 1.5 m/s forward, 0.8 rad/s of yaw.
  #
  # Yaw is stored UNWRAPPED so that linear interpolation between samples is
  # exact here. A real tf2 buffer stores quaternions and slerps them, for
  # the same reason and with more machinery.
  V = 1.5
  W = 0.8
  RATE_HZ = 50.0
  SPAN_S = 12.0

  TF_BUFFER = []
  for _i in range(int(SPAN_S * RATE_HZ)):
      _t = _i / RATE_HZ
      TF_BUFFER.append({
          "t": _t,
          "x": (V / W) * math.sin(W * _t),
          "y": (V / W) * (1.0 - math.cos(W * _t)),
          "yaw": W * _t,
      })

  BUFFER_S = 10.0          # tf2's default cache duration

  # A scan captured at this time, handed to a detector that takes 80 ms.
  T_CAPTURE = 8.000
  PROCESS_MS = 80.0
