id: ros-l5-launch
title: "The parameter file that configures nothing"
lesson: modules/06-ros2/05-launch-params
description: >-
  A YAML file with the right values in it, a node that ignores all of them,
  and a topic that does not connect because of one leading slash. Both
  failures are silent, both are configuration rather than code, and both are
  found by resolving names the way the middleware does.
setup_code: |
  # The node, as launched: a controller inside a per-robot namespace.
  NODE = {"name": "controller", "namespace": "/robot1"}

  # What the node declares, with the values it uses if nobody says otherwise.
  DEFAULTS = {
      "max_speed": 0.5,
      "kp": 1.0,
      "ki": 0.0,
      "lookahead": 0.8,
      "frame_id": "base_link",
  }

  # The parameter file. Each top-level key is a node's FULLY QUALIFIED name,
  # or the wildcard "/**", which matches any node.
  PARAM_YAML = {
      "/controller": {                       # written before namespacing existed
          "ros__parameters": {"max_speed": 1.5, "kp": 2.4},
      },
      "/robot1/controller": {
          "ros__parameters": {"lookahead": 1.2},
      },
      "/**": {
          "ros__parameters": {"ki": 0.05},
      },
  }

  # Set in the launch file...
  LAUNCH_OVERRIDES = {"kp": 3.0}
  # ...and on the command line, by someone debugging.
  CLI_OVERRIDES = {"max_speed": 2.0}

  # Two endpoints that are supposed to talk to each other.
  CONTROLLER_PUB = {"name": "cmd_vel", "node": NODE, "remappings": {}}
  BASE_SUB = {"name": "/cmd_vel",
              "node": {"name": "base_driver", "namespace": "/robot1"},
              "remappings": {}}
starter_code: |
