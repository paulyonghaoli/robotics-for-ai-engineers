  def meets_deadline(callbacks, name, period_ms, threads):
      """Can `name` always start and finish inside its period?"""
      # TODO
      return True

  def deadlocks(caller_group, server_group, threads):
      """A callback makes a SYNCHRONOUS service call and waits for the
      response. Does it wait forever?

      The response can only be delivered by the executor, and the executor
      can only deliver it by running another callback. So:

        - one thread: there is no other thread to run it. Deadlock.
        - several threads, but the caller and the server share a
          mutually-exclusive group: the group is occupied by the caller, so
          the server callback cannot start. Deadlock.
        - otherwise the response gets delivered and the call returns.
      """
