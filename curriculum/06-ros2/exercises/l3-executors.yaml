  print("utilization: %.3f of one thread\n" % utilization(CALLBACKS))
  for _t in (1, 4):
      _d = max_delay_ms(CALLBACKS, "control_timer", _t)
      print("%d thread(s): control_timer waits up to %5.1f ms (period %.0f) -> %s" % (
          _t, _d, CONTROL_PERIOD_MS,
          "ok" if meets_deadline(CALLBACKS, "control_timer", CONTROL_PERIOD_MS, _t) else "MISSES"))
  _fixed = regroup(CALLBACKS, "control_timer", "control")
  print("4 threads, own group: %.1f ms -> %s" % (
      max_delay_ms(_fixed, "control_timer", 4),
      "ok" if meets_deadline(_fixed, "control_timer", CONTROL_PERIOD_MS, 4) else "MISSES"))
tests: |
  _C = CALLBACKS

  # 1. The work fits. That is not the same as being on time.
  _u = utilization(_C)
  assert abs(_u - 0.871) < 0.002, "expected 0.871 of one thread, got %.3f" % _u
  assert _u < 1.0, "there is spare capacity on the thread"

  _delay1 = max_delay_ms(_C, "control_timer", 1)
  assert abs(_delay1 - 77.0) < 1e-9, (
      "on one thread every other callback can be ahead of yours: "
      "12 + 18 + 2 + 45 = 77 ms, got %.1f" % _delay1)
  assert not meets_deadline(_C, "control_timer", CONTROL_PERIOD_MS, 1), (
      "the control timer's period is 20 ms and it can start 77 ms late. "
      "Utilization is 87%% and the loop misses its deadline by four times over "
      "— head-of-line blocking is the constraint, not capacity.")

  assert sorted(blockers(_C, "control_timer", 1)) == [
      "camera_cb", "diagnostics", "map_client", "scan_cb"], (
      "on one thread, everything else blocks you")

  # 2. Switching executors, and changing nothing.
  _delay4 = max_delay_ms(_C, "control_timer", 4)
  assert abs(_delay4 - _delay1) < 1e-9, (
      "four threads gives exactly the same %.1f ms, because every callback is "
      "in the SAME mutually-exclusive group and a mutually-exclusive group "
      "never runs two of its callbacks at once however many threads exist. "
      "This is why 'I switched to a MultiThreadedExecutor and nothing "
      "changed' is the most common report in the module." % _delay4)
  assert not meets_deadline(_C, "control_timer", CONTROL_PERIOD_MS, 4)

  # 3. The fix is the group, not the thread count.
  _fixed = regroup(_C, "control_timer", "control")
  assert blockers(_fixed, "control_timer", 4) == [], (
      "alone in its group, nothing can delay it")
  assert max_delay_ms(_fixed, "control_timer", 4) == 0.0
  assert meets_deadline(_fixed, "control_timer", CONTROL_PERIOD_MS, 4), (
      "own group plus threads to run it: the timer starts on time")

  # ...and the group alone is not enough either.
  assert not meets_deadline(_fixed, "control_timer", CONTROL_PERIOD_MS, 1), (
      "on one thread the group buys nothing — there is only ever one callback "
      "running, so 'may run concurrently' has nothing to run with. Both "
      "changes are required and neither is sufficient.")

  # 4. The deadlock, and the fix that does not fix it.
  assert deadlocks("default", "default", 1), (
      "a synchronous service call on a single-threaded executor waits for a "
      "response only that same thread could deliver")
  assert deadlocks("default", "default", 4), (
      "...and four threads does not help while both callbacks share one "
      "mutually-exclusive group: the group is occupied by the caller, so the "
      "server callback cannot start")
  assert not deadlocks("default", "services", 4), (
      "separate groups and threads to run them: the response is delivered and "
      "the call returns")
  assert deadlocks("default", "services", 1), (
      "separate groups on one thread still deadlocks — there is no second "
      "thread to deliver on")
  assert not deadlocks("services", "services", 4), (
      "a REENTRANT group can run its own callbacks concurrently, so sharing "
      "one is safe here in a way that sharing a mutually-exclusive group is not")

  # 5. And the option that needs no executor surgery at all.
  assert max_delay_ms(regroup(
      {k: v for k, v in _C.items() if k != "map_client"}, "control_timer", "default"),
      "control_timer", 1) == 32.0, (
      "delete the blocking service client and the worst case drops from 77 ms "
      "to 32 — still over a 20 ms period, and a reminder that the executor is "
      "not the only thing you can change")
hints:
  - "utilization: sum `hz * duration_ms / 1000` over the callbacks."
  - "blockers on one thread is every other callback. On several threads it is the other callbacks whose group equals yours AND whose group is mutually_exclusive — a reentrant group blocks nothing, including itself."
  - "max_delay_ms sums the durations of blockers(). meets_deadline is `max_delay + own duration <= period`."
  - "deadlocks: True if threads == 1. Otherwise True only when the two groups are the same and that group is mutually_exclusive. Note the asymmetry — sharing a REENTRANT group is fine, which is what makes reentrant groups the usual answer for service clients."
solution: |
  def utilization(callbacks):
      return sum(c["hz"] * c["duration_ms"] / 1000.0 for c in callbacks.values())

  def blockers(callbacks, name, threads):
      me = callbacks[name]
      out = []
      for other, c in callbacks.items():
          if other == name:
              continue
          if threads == 1:
              # One thread runs one callback. Everything is in front of you.
              out.append(other)
          elif c["group"] == me["group"] and GROUPS[me["group"]] == "mutually_exclusive":
              # Same mutually-exclusive group: never concurrent, whatever
              # the thread count says.
              out.append(other)
      return sorted(out)

  def max_delay_ms(callbacks, name, threads):
      return sum(callbacks[b]["duration_ms"] for b in blockers(callbacks, name, threads))

  def meets_deadline(callbacks, name, period_ms, threads):
      return bool(max_delay_ms(callbacks, name, threads)
                  + callbacks[name]["duration_ms"] <= period_ms)

  def deadlocks(caller_group, server_group, threads):
      if threads == 1:
          # Nothing else can spin the executor while this callback waits.
          return True
      if caller_group == server_group and GROUPS[caller_group] == "mutually_exclusive":
          # The group is occupied by the caller, so the server cannot start.
          return True
      return False

  print("utilization: %.3f of one thread\n" % utilization(CALLBACKS))
  for _t in (1, 4):
      _d = max_delay_ms(CALLBACKS, "control_timer", _t)
      print("%d thread(s): control_timer waits up to %5.1f ms (period %.0f) -> %s" % (
          _t, _d, CONTROL_PERIOD_MS,
          "ok" if meets_deadline(CALLBACKS, "control_timer", CONTROL_PERIOD_MS, _t) else "MISSES"))
  _fixed = regroup(CALLBACKS, "control_timer", "control")
  print("4 threads, own group: %.1f ms -> %s" % (
      max_delay_ms(_fixed, "control_timer", 4),
      "ok" if meets_deadline(_fixed, "control_timer", CONTROL_PERIOD_MS, 4) else "MISSES"))
