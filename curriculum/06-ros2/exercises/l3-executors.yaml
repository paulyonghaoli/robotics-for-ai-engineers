id: ros-l3-executors
title: "87% utilized and missing every deadline"
lesson: modules/06-ros2/03-executors
description: >-
  Five callbacks on one node. The thread is 87% utilized, which sounds fine,
  and the 50 Hz control timer can be 77 ms late, which is not. Then work out
  why switching to a multi-threaded executor changes nothing at all until
  you also change something else.
setup_code: |
  # A callback group decides which callbacks may run AT THE SAME TIME.
  #
  #   mutually_exclusive  never two at once, however many threads exist
  #   reentrant           any number at once, given threads to run them
  #
  # Every callback lands in one mutually-exclusive group by default, which
  # is the safe choice and the reason a multi-threaded executor so often
  # changes nothing.
  GROUPS = {
      "default": "mutually_exclusive",
      "control": "mutually_exclusive",
      "services": "reentrant",
  }

  CALLBACKS = {
      "control_timer": {"group": "default", "hz": 50.0, "duration_ms": 4.0},
      "scan_cb":       {"group": "default", "hz": 10.0, "duration_ms": 12.0},
      "camera_cb":     {"group": "default", "hz": 30.0, "duration_ms": 18.0},
      "diagnostics":   {"group": "default", "hz": 1.0,  "duration_ms": 2.0},
      "map_client":    {"group": "default", "hz": 0.2,  "duration_ms": 45.0},
  }

  CONTROL_PERIOD_MS = 20.0

  def regroup(callbacks, name, group):
      """A copy of `callbacks` with one callback moved to another group."""
      out = {k: dict(v) for k, v in callbacks.items()}
      out[name]["group"] = group
      return out
