id: est-l4-gyro
title: "Characterize a gyro: noise vs bias"
lesson: modules/03-estimation/04-sensor-models
description: >-
  You get a stationary gyro log (the robot isn't moving — every reading is
  pure error). Estimate the bias and noise density, then show the lesson's
  claim: integrated heading error grows ∝ √t from white noise but ∝ t from
  bias — and after a minute, the bias you almost can't see dominates.
setup_code: |
  import numpy as np

  DT = 0.01
  TRUE_BIAS, NOISE_SIGMA = 0.008, 0.02
  RNG = np.random.default_rng(21)
  stationary_log = TRUE_BIAS + RNG.normal(0, NOISE_SIGMA, 60_000)  # 10 min at 100 Hz
