tests: |
  import numpy as np
  _b = estimate_bias(stationary_log)
  assert abs(_b - 0.008) < 0.0005, "bias estimate should be ~0.008 rad/s (got %.4f) - it's just the mean" % _b
  _s = estimate_noise_sigma(stationary_log)
  assert abs(_s - 0.02) < 0.002, "noise sigma should be ~0.02 (got %.4f)" % _s
  _raw = heading_drift(stationary_log)
  assert abs(_raw[6000] - 0.48) < 0.05, "raw 60 s drift should be ~bias*t = 0.48 rad (got %.3f)" % _raw[6000]
  _cor = heading_drift(stationary_log, remove_bias=True)
  assert abs(_cor[6000]) < 0.05, "bias-corrected drift should be ~10x smaller - only the sqrt(t) noise walk remains"
  assert abs(_raw[-1]) > 8 * abs(_cor[-1]), "at 10 min the linear bias term must dominate the noise walk by ~an order of magnitude"
hints:
  - "estimate_bias: np.mean(log). estimate_noise_sigma: np.std(log - bias) — or just np.std(log)."
  - "heading_drift: np.cumsum(log - correction) * DT. The punchline is in the two printed numbers."
solution: |
  import numpy as np

  def estimate_bias(log):
      return float(np.mean(log))

  def estimate_noise_sigma(log):
      return float(np.std(log - np.mean(log)))

  def heading_drift(log, remove_bias=False):
      rates = log - (estimate_bias(log) if remove_bias else 0.0)
      return np.cumsum(rates) * DT

  b, s = estimate_bias(stationary_log), estimate_noise_sigma(stationary_log)
  print("bias %.4f rad/s (true 0.008), sigma %.4f (true 0.02)" % (b, s))
  print("60 s drift, raw:            %.3f rad" % heading_drift(stationary_log)[6000])
  print("60 s drift, bias-corrected: %.3f rad" % heading_drift(stationary_log, True)[6000])
