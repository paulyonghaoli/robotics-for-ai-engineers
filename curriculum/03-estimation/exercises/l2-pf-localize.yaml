tests: |
  import numpy as np
  _lik = likelihood(np.array([3.0, 10.0]), 0.0)
  assert _lik[0] > _lik[1] * 5, "a particle AT a door must be far more likely than one 2.5 m from any door when z = 0"
  assert abs(estimate - true_traj[-1]) < 0.7, "after 30 steps the swarm should have collapsed near the true position %.2f (estimate %.2f)" % (true_traj[-1], estimate)
  assert np.std(particles) < 2.5, "the particle spread should be far tighter than the initial uniform 20 m (std %.2f)" % np.std(particles)
hints:
  - "likelihood: `d = nearest_door_dist(particles) - z; return np.exp(-0.5 * (d / SENSOR_SIGMA)**2) + 1e-300`."
  - "Loop body: `particles += SPEED*DT + rng.normal(0, 0.05, N)`; `weights *= likelihood(...)`; `weights /= weights.sum()`; if `1/np.sum(weights**2) < N/2`: systematic resample (searchsorted on cumsum) and `weights[:] = 1/N`."
  - "The belief is multimodal after the first door (three doors could explain it) — motion between doors is what disambiguates. Don't panic mid-run."
solution: |
  import numpy as np

  rng = np.random.default_rng(0)
  N = 3000
  particles = rng.uniform(0.0, 20.0, N)
  weights = np.full(N, 1.0 / N)

  def likelihood(particles, z):
      d = nearest_door_dist(particles) - z
      return np.exp(-0.5 * (d / SENSOR_SIGMA) ** 2) + 1e-300

  for z in readings:
      particles = particles + SPEED * DT + rng.normal(0, 0.05, N)
      weights = weights * likelihood(particles, z)
      weights = weights / weights.sum()
      if 1.0 / np.sum(weights ** 2) < N / 2:
          positions = (rng.random() + np.arange(N)) / N
          cs = np.cumsum(weights)
          cs[-1] = 1.0
          particles = particles[np.searchsorted(cs, positions)]
          weights = np.full(N, 1.0 / N)

  estimate = np.sum(weights * particles)
  print("estimate:", estimate, " true:", true_traj[-1])
