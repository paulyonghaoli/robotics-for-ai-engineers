id: est-l2-pf-localize
title: "Global localization in the door corridor"
lesson: modules/03-estimation/02-particle-filter
description: >-
  The classic: a robot in a 20 m corridor with doors at known positions,
  starting **completely lost** (uniform belief). It drives right at 0.5 m/s
  sensing only its distance to the nearest door. Implement the measurement
  weighting and the filter loop; watch a uniform swarm collapse onto the
  true position.
setup_code: |
  import numpy as np

  DOORS = np.array([3.0, 7.5, 15.0])
  DT, SPEED, SENSOR_SIGMA = 0.5, 0.5, 0.3
  RNG = np.random.default_rng(11)

  def nearest_door_dist(x):
      """Distance from each position in `x` to the nearest door.

      Accepts a scalar or an array of positions and always returns a 1-D
      array, so it can score every particle at once.
      """
      return np.min(np.abs(np.atleast_1d(x)[:, None] - DOORS[None, :]), axis=1)

  # Simulate the true robot and its sensor readings for 30 steps:
  true_traj = 2.0 + SPEED * DT * np.arange(30)
  readings = nearest_door_dist(true_traj) + RNG.normal(0, SENSOR_SIGMA, 30)
