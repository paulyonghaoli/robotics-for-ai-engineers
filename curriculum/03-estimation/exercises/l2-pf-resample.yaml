id: est-l2-pf-resample
title: "Systematic resampling and N_eff"
lesson: modules/03-estimation/02-particle-filter
description: >-
  Implement the particle filter's two health mechanisms: the effective
  sample size N_eff, and systematic (low-variance) resampling. The tests
  verify the statistics — heavy particles get cloned in proportion to
  their weight, light ones vanish.
setup_code: |
  import numpy as np
starter_code: |
  import numpy as np

  def neff(weights):
      """Effective sample size: 1 / sum(w_i^2) for normalized weights."""
      # TODO
      return 0.0

  def systematic_resample(weights, rng):
      """Return N indices into the particle array, sampled systematically.

      One random offset u0 ~ U(0, 1/N); pointers at u0 + k/N for k = 0..N-1;
      each pointer selects the particle whose cumulative-weight interval
      contains it (np.searchsorted on the cumsum).
      """
      # TODO
      return np.zeros(len(weights), dtype=int)

  w = np.array([0.7, 0.1, 0.1, 0.1])
  print("neff:", neff(w))                                 # expect ~1.92
  print(systematic_resample(w, np.random.default_rng(0))) # mostly index 0
tests: |
  import numpy as np
  assert abs(neff(np.full(100, 0.01)) - 100.0) < 1e-9, "uniform weights: neff must equal N"
  _w = np.zeros(50); _w[7] = 1.0
  assert abs(neff(_w) - 1.0) < 1e-9, "one particle owning all weight: neff must be 1"
  assert abs(neff(np.array([0.7, 0.1, 0.1, 0.1])) - 1.0 / 0.52) < 1e-6, "neff of (0.7,0.1,0.1,0.1) is 1/0.52"
  _rng = np.random.default_rng(1)
  _w = np.array([0.5, 0.25, 0.125, 0.125])
  _counts = np.zeros(4)
  for _ in range(200):
      _idx = systematic_resample(_w, _rng)
      assert len(_idx) == 4 and _idx.dtype.kind in "iu", "must return N integer indices"
      _counts += np.bincount(_idx, minlength=4)
  _freq = _counts / _counts.sum()
  assert np.allclose(_freq, _w, atol=0.03), "over many draws, selection frequency must match the weights (got %s)" % np.round(_freq, 3)
  _w2 = np.zeros(100); _w2[42] = 1.0
  _idx = systematic_resample(_w2, np.random.default_rng(2))
  assert np.all(_idx == 42), "a particle with all the weight must be selected every time"
hints:
  - "neff: `1.0 / np.sum(weights**2)` — weights already normalized."
  - "resample: n = len(weights); positions = (rng.random() + np.arange(n)) / n; cs = np.cumsum(weights); cs[-1] = 1.0; return np.searchsorted(cs, positions)."
solution: |
  import numpy as np

  def neff(weights):
      return 1.0 / np.sum(np.asarray(weights) ** 2)

  def systematic_resample(weights, rng):
      n = len(weights)
      positions = (rng.random() + np.arange(n)) / n
      cs = np.cumsum(weights)
      cs[-1] = 1.0
      return np.searchsorted(cs, positions)

  w = np.array([0.7, 0.1, 0.1, 0.1])
  print("neff:", neff(w))
  print(systematic_resample(w, np.random.default_rng(0)))
