tests: |
  import numpy as np
  assert 0.5 < mean_nees(RUNS["A"]) < 1.6, "filter A is honest: NEES near 1 (got %.2f)" % mean_nees(RUNS["A"])
  assert mean_nees(RUNS["B"]) > 3.0, "filter B trusts a noisy sensor: NEES should blow up"
  assert mean_nis(RUNS["B"]) > 3.0, "...and so should its NIS - overconfidence is visible at RUNTIME"
  assert mean_nees(RUNS["C"]) < 0.5, "filter C is paranoid: NEES far below 1"
  assert mean_nees(RUNS["D"]) > 3.0, "filter D's STATE is wrong: NEES should be high (got %.2f)" % mean_nees(RUNS["D"])
  assert 0.6 < mean_nis(RUNS["D"]) < 1.6, "...but filter D's NIS looks PERFECT (got %.2f) - the sensor offset was absorbed into the state, so the innovations are consistent. This is the case runtime monitoring cannot catch." % mean_nis(RUNS["D"])
  _want = {"A": "healthy", "B": "overconfident", "C": "pessimistic", "D": "unobservable-bias"}
  for _n, _lab in _want.items():
      assert diagnose(RUNS[_n]) == _lab, "filter %s should be diagnosed %r, got %r" % (_n, _lab, diagnose(RUNS[_n]))
hints:
  - "mean_nees: np.mean(run['err'][50:]**2 / run['P'][50:]). NIS likewise with y and S."
  - "Order the checks carefully: test the NEES-high-but-NIS-fine case BEFORE the plain overconfident case, since both have high NEES."
  - "Why D is the important one: a constant sensor offset is unobservable to this filter, so it slides into the state estimate and the innovations go back to looking perfect. Only ground truth exposes it — which is precisely why simulation-time NEES auditing exists and why you cannot rely on NIS alone."
solution: |
  import numpy as np

  def mean_nees(run):
      return float(np.mean(run["err"][50:] ** 2 / run["P"][50:]))

  def mean_nis(run):
      return float(np.mean(run["y"][50:] ** 2 / run["S"][50:]))

  def diagnose(run):
      nees, nis = mean_nees(run), mean_nis(run)
      if nees > 2.0 and 0.6 < nis < 1.6:
          return "unobservable-bias"
      if nees > 2.0:
          return "overconfident"
      if nees < 0.5:
          return "pessimistic"
      return "healthy"

  for name, run in RUNS.items():
      print(name, "nees=%6.2f nis=%6.2f ->" % (mean_nees(run), mean_nis(run)), diagnose(run))
