id: est-l6-nees
title: "Audit four filters"
lesson: modules/03-estimation/06-consistency-lab
description: >-
  Four filters ran on the same tracking problem. All have plausible RMSE.
  You get their logs — errors, covariances, innovations — and must compute
  NEES/NIS and name each condition. One of the four is the case that makes
  this lab necessary: a filter whose **runtime** diagnostics look perfect
  while its state is quietly wrong.
setup_code: |
  import numpy as np

  def _run(r_assumed, sensor_bias=0.0, seed=5):
      rng = np.random.default_rng(seed)
      q_true, r_true = 0.04, 1.0
      x_true, x, P = 0.0, 0.0, 10.0
      errs, Ps, ys, Ss = [], [], [], []
      for _ in range(500):
          x_true += rng.normal(0, np.sqrt(q_true))
          P = P + q_true
          z = x_true + rng.normal(0, np.sqrt(r_true)) + sensor_bias
          y = z - x
          S = P + r_assumed
          K = P / S
          x, P = x + K * y, (1 - K) * P
          errs.append(x - x_true); Ps.append(P); ys.append(y); Ss.append(S)
      return dict(err=np.array(errs), P=np.array(Ps), y=np.array(ys), S=np.array(Ss))

  RUNS = {
      "A": _run(r_assumed=1.0),                  # honest
      "B": _run(r_assumed=0.05),                 # trusts a noisy sensor blindly
      "C": _run(r_assumed=25.0),                 # paranoid about a fine sensor
      "D": _run(r_assumed=1.0, sensor_bias=0.8), # sensor offset the filter absorbs
  }
