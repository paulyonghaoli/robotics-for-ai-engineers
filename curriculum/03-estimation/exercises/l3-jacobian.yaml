id: est-l3-jacobian
title: "The range-bearing Jacobian, by hand"
lesson: modules/03-estimation/03-ekf
description: >-
  Derive and implement the observation Jacobian H for a range-bearing
  measurement of a landmark — the one worked example every estimation
  engineer does once. Your analytic Jacobian is checked against finite
  differences (the standard robotics unit-test idiom; steal it).
setup_code: |
  import numpy as np

  def wrap(a):
      """Wrap an angle to (-pi, pi]. Works elementwise on arrays."""
      return -(np.mod(-a + np.pi, 2 * np.pi) - np.pi)

  def obs(x, lm):
      """Range and bearing to landmark `lm` from robot state `x`.

      Returns (range in metres, bearing in radians), bearing wrapped to
      (-pi, pi] and measured relative to the robot heading.
      """
      d = np.asarray(lm) - x[:2]
      return np.array([np.hypot(d[0], d[1]), wrap(np.arctan2(d[1], d[0]) - x[2])])

  def finite_diff_jac(x, lm, eps=1e-6):
      """Central-difference Jacobian of `obs`, wrapping the bearing row.

      The reference to check your analytic Jacobian against. Returns 2x3.
      """
      J = np.zeros((2, 3))
      for k in range(3):
          dx = np.zeros(3); dx[k] = eps
          diff = obs(x + dx, lm) - obs(x - dx, lm)
          diff[1] = wrap(diff[1])
          J[:, k] = diff / (2 * eps)
      return J
