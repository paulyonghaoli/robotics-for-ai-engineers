id: eval-l4-provenance
title: "Find the bad batch in minutes, not weeks"
lesson: modules/10-evaluation/04-dataset-lifecycle
description: >-
  Model performance dropped after ingesting new data. You have 900
  trajectory records with provenance. Write the queries that isolate the
  cause — then discover that the second problem in this dataset is
  invisible to performance metrics entirely, and only a completeness
  audit finds it.
setup_code: |
  import numpy as np

  _rng = np.random.default_rng(17)
  ROBOTS = ["rb-01", "rb-02", "rb-03", "rb-04"]
  OPERATORS = ["op-a", "op-b", "op-c"]

  def _make():
      recs = []
      for i in range(900):
          robot = ROBOTS[i % 4]
          # rb-03 was recalibrated badly partway through collection
          bad = (robot == "rb-03" and i > 500)
          rec = {
              "trajectory_id": "t%04d" % i,
              "robot_id": robot,
              "firmware": "2.3.1" if i <= 500 else "2.4.0",
              "calibration_id": ("cal-bad" if bad else "cal-%s" % robot),
              "operator_id": OPERATORS[i % 3],
              "source": "teleop" if i % 10 else "sim",
              "outcome": "success" if _rng.random() < (0.45 if bad else 0.9) else "failure",
              # provenance gap: synthetic rows are missing their seed
              "generator_seed": None if i % 10 == 0 else int(_rng.integers(0, 99999)),
          }
          recs.append(rec)
      return recs

  RECORDS = _make()
  REQUIRED_FIELDS = ["trajectory_id", "robot_id", "firmware", "calibration_id",
                     "operator_id", "source", "outcome", "generator_seed"]
