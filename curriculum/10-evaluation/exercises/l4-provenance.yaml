tests: |
  import numpy as np
  _br = success_rate_by(RECORDS, "robot_id")
  assert set(_br) == set(ROBOTS), "should group by every robot present"
  assert all(0.0 <= v <= 1.0 for v in _br.values()), "rates must be fractions"
  assert _br["rb-03"] < _br["rb-01"] - 0.1, "rb-03 should look visibly worse in aggregate (%.2f vs %.2f)" % (_br["rb-03"], _br["rb-01"])
  # ...but robot_id is the wrong granularity: rb-03 was fine before recalibration.
  _bc = success_rate_by(RECORDS, "calibration_id")
  assert "cal-bad" in _bc, "calibration_id should isolate the bad batch"
  assert _bc["cal-bad"] < 0.6, "the bad calibration should be clearly bad (got %.2f)" % _bc["cal-bad"]
  assert _bc["cal-rb-03"] > 0.8, "rb-03's GOOD calibration should look healthy - the robot isn't the problem, one calibration is"
  _susp = find_suspect(RECORDS, "calibration_id")
  assert _susp == ["cal-bad"], "exactly one calibration should be flagged, got %s" % _susp
  assert find_suspect(RECORDS, "operator_id") == [], "no operator is at fault - a good query must not manufacture suspects"
  # The second problem: a provenance gap that performance metrics cannot see.
  _c = completeness(RECORDS)
  assert set(_c) == set(REQUIRED_FIELDS), "audit every required field"
  assert _c["robot_id"] == 1.0, "robot_id is fully populated"
  assert _c["generator_seed"] < 0.95, "generator_seed is MISSING on the synthetic rows (%.2f) - nothing in the outcome data reveals this, and without it that data cannot be regenerated" % _c["generator_seed"]
hints:
  - "success_rate_by: build {value: [outcomes]} then average `o == 'success'` per group."
  - "completeness: for each field, `sum(r.get(f) is not None for r in records) / len(records)`."
  - "The point of the two-part exercise: aggregating by robot_id blames rb-03 entirely, but rb-03 was fine until recalibration. Granular provenance turns 'a robot is bad' (replace hardware) into 'a calibration is bad' (drop 100 rows, recollect). And the missing seeds are invisible to every performance metric — only an explicit completeness audit surfaces them."
solution: |
  import numpy as np

  def success_rate_by(records, field):
      groups = {}
      for r in records:
          groups.setdefault(r[field], []).append(r["outcome"] == "success")
      return {k: float(np.mean(v)) for k, v in groups.items()}

  def find_suspect(records, field, threshold=0.7):
      return sorted(k for k, v in success_rate_by(records, field).items() if v < threshold)

  def completeness(records, fields=None):
      fields = fields or REQUIRED_FIELDS
      n = len(records)
      return {f: sum(r.get(f) is not None for r in records) / n for f in fields}

  print("by robot:      ", {k: round(v, 2) for k, v in success_rate_by(RECORDS, "robot_id").items()})
  print("by calibration:", {k: round(v, 2) for k, v in success_rate_by(RECORDS, "calibration_id").items()})
  print("suspect calibrations:", find_suspect(RECORDS, "calibration_id"))
  print("completeness:  ", {k: round(v, 2) for k, v in completeness(RECORDS).items()})
