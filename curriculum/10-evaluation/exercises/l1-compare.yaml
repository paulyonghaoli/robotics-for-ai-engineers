id: eval-l1-compare
title: "Is stack B actually better? Paired evaluation"
lesson: modules/10-evaluation/01-statistical-rigor
description: >-
  Two capstone stacks, the same randomized worlds. Implement the paired
  comparison and a bootstrap confidence interval on the DIFFERENCE — the
  quantity you actually care about. Then discover why pairing matters:
  the same data, analyzed unpaired, fails to detect a real improvement.
setup_code: |
  import numpy as np

  # Simulated evaluation logs: 80 worlds, each run by BOTH stacks.
  # World difficulty varies a lot (that's the nuisance variance pairing removes).
  _rng = np.random.default_rng(4)
  _difficulty = _rng.uniform(0.10, 0.80, 80)          # per-world success probability
  A_RESULTS = (_rng.random(80) < _difficulty).astype(int)
  B_RESULTS = (_rng.random(80) < np.clip(_difficulty + 0.25, 0, 1)).astype(int)
