id: eval-l3-regression
title: "Build a nightly gate people will actually trust"
lesson: modules/10-evaluation/03-regression-from-logs
description: >-
  Four nights of results against a baseline: one genuine regression, one
  pure noise, one statistically real but operationally trivial, and one
  where a single flaky scenario tries to hijack the verdict. Build a gate
  that blocks exactly the first — and quarantines the flake.
setup_code: |
  import numpy as np

  N_SCEN = 120
  # Each scenario has a fixed difficulty. Whether a stack clears it is
  # MOSTLY determined by that difficulty — only borderline scenarios flip
  # run to run. This is why pairing on identical scenarios works: the
  # dominant variance cancels.
  _THRESHOLD = np.random.default_rng(11).uniform(0.10, 0.90, N_SCEN)

  def _run(skill_delta, seed, flaky_scenarios=()):
      rng = np.random.default_rng(seed)
      noise = rng.normal(0.0, 0.02, N_SCEN)      # small run-to-run variation
      out = ((0.75 + skill_delta + noise) > _THRESHOLD).astype(int)
      for s in flaky_scenarios:                  # cliff-edge scenarios
          out[s] = int(rng.random() < 0.5)
      return out

  BASELINE = _run(0.0, seed=100)
  FLAKY = (7, 23, 41)

  NIGHTS = {
      "real_regression": _run(-0.18,  seed=201),
      "just_noise":      _run(0.0,    seed=202),
      "trivial_change":  _run(-0.022, seed=203),
      "flaky_only":      _run(0.0,    seed=204, flaky_scenarios=FLAKY),
  }
