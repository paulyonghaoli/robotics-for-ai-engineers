id: eval-l7-audit
title: "Audit four submitted results"
lesson: modules/10-evaluation/07-lab-benchmark-lied
description: >-
  Four benchmark results, each arithmetically correct and reproducible.
  One is honest. Write the checks that expose the other three — an
  unsupported sample size, a saturated benchmark, and a result a trivial
  baseline matches — and confirm the good one survives all of them.
setup_code: |
  import numpy as np

  Z95 = 1.959963985

  # Four submissions. Each has raw per-episode outcomes, plus the outcomes
  # of a deliberately trivial baseline on the SAME episodes, plus the
  # scores every competing method got on that benchmark.
  _r = np.random.default_rng(4)

  SUBMISSIONS = {
      # Big claim, tiny sample: 88% of 25 looks strong and supports nothing.
      "tiny_sample": dict(
          outcomes=(_r.random(25) < 0.88).astype(int),
          trivial_baseline=(_r.random(25) < 0.30).astype(int),
          peer_scores=[0.55, 0.61, 0.58, 0.66],
      ),
      # Saturated: everyone is at 96-98%, including this.
      "saturated": dict(
          outcomes=(_r.random(400) < 0.97).astype(int),
          trivial_baseline=(_r.random(400) < 0.31).astype(int),
          peer_scores=[0.96, 0.97, 0.98, 0.96, 0.97],
      ),
      # A trivial baseline matches it: the benchmark isn't measuring the
      # capability its name claims.
      "trivial_matches": dict(
          outcomes=(_r.random(400) < 0.71).astype(int),
          trivial_baseline=(_r.random(400) < 0.69).astype(int),
          peer_scores=[0.60, 0.65, 0.55, 0.68],
      ),
      # The honest one: adequate n, real margin over a trivial baseline,
      # and a benchmark that still separates methods.
      "sound": dict(
          outcomes=(_r.random(400) < 0.78).astype(int),
          trivial_baseline=(_r.random(400) < 0.34).astype(int),
          peer_scores=[0.52, 0.61, 0.70, 0.58],
      ),
  }
