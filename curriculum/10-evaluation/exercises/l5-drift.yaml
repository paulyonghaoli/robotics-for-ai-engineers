id: eval-l5-drift
title: "Detect the drift before the success rate moves"
lesson: modules/10-evaluation/05-drift-monitoring
description: >-
  200 days of fleet telemetry with a lidar degrading from day 90. Build a
  windowed KS test and a CUSUM detector, then measure the thing that
  matters: how many days of warning each layer buys you before the
  outcome metric finally drops. Also included — a lighting change that
  shifts the inputs and means nothing, which your detector must not
  panic about.
setup_code: |
  import numpy as np

  N_DAYS = 220
  _rng = np.random.default_rng(5)

  # Layer 1: sensor input. A lidar degrading steadily from day 90.
  _deg = np.clip((np.arange(N_DAYS) - 90) * 0.030, 0, None)[:, None]
  SENSOR = _rng.normal(4.0 + _deg * 0.5, 0.30 + _deg * 0.10, (N_DAYS, 40))

  # A harmless TRANSIENT: a two-day lighting change on day 40 that shifts
  # the input distribution and affects nothing downstream. Requiring
  # persistence is what stops this from paging someone at 3am.
  SENSOR[40:42] += 0.55

  # Layer 2: filter consistency (NIS ~ 1 when healthy), lagging the input.
  _nis_lag = np.clip((np.arange(N_DAYS) - 125) * 0.020, 0, None)
  NIS = _rng.normal(1.0 + _nis_lag, 0.12, N_DAYS)

  # Layer 3: outcome — moves last, and is smoothed because daily success
  # rates are noisy enough to cross any fixed line by chance.
  _succ = np.clip(0.95 - np.clip((np.arange(N_DAYS) - 155) * 0.004, 0, None), 0, 1)
  SUCCESS = _rng.binomial(200, _succ, N_DAYS) / 200.0

  def rolling_mean(x, w=7):
      return np.convolve(np.asarray(x, dtype=float), np.ones(w) / w, mode="valid")

  REFERENCE = slice(0, 35)     # a known-good baseline period
