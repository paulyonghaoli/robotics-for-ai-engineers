tests: |
  import numpy as np
  _a = np.random.default_rng(0).normal(0, 1, 500)
  assert ks_statistic(_a, _a) < 1e-9, "KS of a sample against itself is 0"
  _b = np.random.default_rng(1).normal(3.0, 1, 500)
  assert ks_statistic(_a, _b) > 0.8, "KS between well-separated samples should be near 1 (got %.2f)" % ks_statistic(_a, _b)
  assert 0.0 <= ks_statistic(_a, _b) <= 1.0, "KS is bounded in [0, 1]"
  _input_day = drift_days(SENSOR)
  assert _input_day is not None, "the sensor degradation must be detected"
  assert _input_day > 60, "the day-40 LIGHTING CHANGE must not trigger the alarm (fired on day %s) - it is a real input shift with no consequence, and persistence is what filters it" % _input_day
  assert 90 <= _input_day <= 140, "input drift should be caught in the degradation ramp, got day %s" % _input_day
  _nis_day = cusum_alarm(NIS)
  assert _nis_day is not None, "CUSUM must catch the NIS rise"
  assert _nis_day > _input_day, "belief drift should follow input drift, not precede it (%s vs %s)" % (_nis_day, _input_day)
  _outcome_day = int(np.argmax(rolling_mean(SUCCESS) < 0.90))
  assert _input_day < _outcome_day, "the whole point: input drift must fire BEFORE the outcome drops (day %s vs %s)" % (_input_day, _outcome_day)
  assert _outcome_day - _input_day >= 15, "the warning budget should be substantial - got only %d days" % (_outcome_day - _input_day)
  _flat = np.full(120, 1.0)
  assert cusum_alarm(_flat) is None, "CUSUM must not alarm on a flat, healthy series"
hints:
  - "ks_statistic: `allv = np.sort(np.concatenate([reference, window]))`; `cdf_r = np.searchsorted(np.sort(reference), allv, 'right')/len(reference)`; same for window; return `np.max(np.abs(cdf_r - cdf_w))`."
  - "drift_days: track a run counter across days; reset it to 0 whenever the day's KS is below threshold, and return `day` when the counter reaches `persistence`."
  - "The day-40 lighting spike is a genuine distribution shift, but it lasts only two days — shorter than the persistence window. That is exactly what persistence is for: transients are real and usually irrelevant."
solution: |
  import numpy as np

  def ks_statistic(reference, window):
      r = np.sort(np.asarray(reference).ravel())
      w = np.sort(np.asarray(window).ravel())
      allv = np.sort(np.concatenate([r, w]))
      cdf_r = np.searchsorted(r, allv, side="right") / len(r)
      cdf_w = np.searchsorted(w, allv, side="right") / len(w)
      return float(np.max(np.abs(cdf_r - cdf_w)))

  def drift_days(series_2d, ref=REFERENCE, threshold=0.35, persistence=3):
      reference = np.asarray(series_2d)[ref].ravel()
      run = 0
      for day in range(len(series_2d)):
          d = ks_statistic(reference, series_2d[day])
          run = run + 1 if d > threshold else 0
          if run >= persistence:
              return day
      return None

  def cusum_alarm(series, mu0=1.0, slack=0.15, threshold=2.5):
      s = 0.0
      for i, x in enumerate(np.asarray(series)):
          s = max(0.0, s + (x - mu0) - slack)
          if s > threshold:
              return i
      return None

  ref_vals = SENSOR[REFERENCE].ravel()
  print("input drift detected on day: ", drift_days(SENSOR))
  print("belief drift (CUSUM on NIS): ", cusum_alarm(NIS))
  print("outcome drop below 0.90 on:  ", int(np.argmax(rolling_mean(SUCCESS) < 0.90)))
