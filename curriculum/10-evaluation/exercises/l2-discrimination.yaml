id: eval-l2-discrimination
title: "A benchmark everything passes has stopped measuring"
lesson: modules/10-evaluation/02-scenario-suites
description: >-
  Three candidate suites and three stacks whose true ordering you know.
  Work out which suite can actually tell them apart. Two of the three are
  useless — one because it's too easy, one because it's too hard — and
  neither reveals that from its aggregate score alone.
setup_code: |
  import numpy as np

  # Ground truth: stack skill on a 0-1 scale. C is genuinely better than B,
  # which is genuinely better than A. A good suite must recover this order.
  TRUE_SKILL = {"A": 0.55, "B": 0.70, "C": 0.85}

  def run_suite(stack, difficulty, n=120, seed=0):
      """Episode outcomes (1 = success). Success probability is logistic in
      (skill - difficulty), so it saturates at both extremes — which is why
      a suite that is far too easy and one far too hard both lose their
      ability to separate stacks."""
      # Deterministic per-stack offset: Python's str hash is randomized
      # per process, so hash() here would make results irreproducible.
      rng = np.random.default_rng(seed + sum(ord(c) for c in stack))
      skill = TRUE_SKILL[stack]
      d = rng.normal(difficulty, 0.08, n)
      p = 1.0 / (1.0 + np.exp(-8.0 * (skill - d)))
      return (rng.random(n) < p).astype(int)

  SUITES = {"trivial": 0.10, "balanced": 0.70, "brutal": 1.15}
