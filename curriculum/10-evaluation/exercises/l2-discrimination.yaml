tests: |
  import numpy as np
  _t = suite_scores(SUITES["trivial"])
  assert set(_t) == {"A", "B", "C"}, "return a rate for each stack"
  assert min(_t.values()) > 0.9, "on the TRIVIAL suite everything should score >90%% - that's the problem"
  assert spread(SUITES["trivial"]) < 0.08, "trivial suite has almost no dynamic range (got %.2f)" % spread(SUITES["trivial"])
  assert not discriminates(SUITES["trivial"]), "a suite everything passes cannot discriminate - it has stopped measuring"
  _b = suite_scores(SUITES["brutal"])
  assert max(_b.values()) < 0.35, "on the BRUTAL suite everything should fail (got max %.2f)" % max(_b.values())
  assert not discriminates(SUITES["brutal"]), "a suite everything fails cannot discriminate either - the opposite error, equally useless"
  assert discriminates(SUITES["balanced"]), "the BALANCED suite should recover A < B < C with real gaps"
  _bal = suite_scores(SUITES["balanced"])
  assert _bal["A"] < _bal["B"] < _bal["C"], "balanced suite must order the stacks correctly"
  assert spread(SUITES["balanced"]) > spread(SUITES["trivial"]), "the useful suite has the widest dynamic range"
hints:
  - "suite_scores: `{s: float(run_suite(s, difficulty, n, seed).mean()) for s in TRUE_SKILL}`."
  - "discriminates: get the scores, then check `s['A'] + margin <= s['B'] and s['B'] + margin <= s['C']`."
  - "The lesson: BOTH failure directions look like a clean number. A suite at 99% and a suite at 5% are equally uninformative, and neither announces itself — you have to check dynamic range deliberately."
solution: |
  import numpy as np

  def suite_scores(difficulty, n=120, seed=0):
      return {s: float(run_suite(s, difficulty, n, seed).mean()) for s in TRUE_SKILL}

  def discriminates(difficulty, n=120, seed=0, margin=0.05):
      s = suite_scores(difficulty, n, seed)
      return bool(s["A"] + margin <= s["B"] and s["B"] + margin <= s["C"])

  def spread(difficulty, n=120, seed=0):
      s = suite_scores(difficulty, n, seed)
      return float(max(s.values()) - min(s.values()))

  for name, d in SUITES.items():
      s = suite_scores(d)
      print("%-9s scores %s  spread %.2f  discriminates %s" % (
          name, {k: round(v, 2) for k, v in s.items()}, spread(d), discriminates(d)))
