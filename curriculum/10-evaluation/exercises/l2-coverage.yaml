id: eval-l2-coverage
title: "Measure what your suite actually covers"
lesson: modules/10-evaluation/02-scenario-suites
description: >-
  A 300-scenario suite that looks thorough. Compute its coverage over the
  parameter space, find the gap, then build a stratified generator that
  fills it. The tests check that you found the hole AND that stratifying
  didn't just shift it somewhere else.
setup_code: |
  import numpy as np

  # Two parameters that matter: obstacle density and start-goal distance.
  DENSITY_BINS = [(0, 4), (4, 8), (8, 12), (12, 16)]     # obstacle count
  DISTANCE_BINS = [(0, 6), (6, 12), (12, 18), (18, 24)]  # metres

  def naive_suite(n=300, seed=0):
      """What you get from 'just randomize it' - normal-ish draws."""
      rng = np.random.default_rng(seed)
      density = np.clip(rng.normal(8, 2.2, n), 0, 15.99)
      distance = np.clip(rng.normal(12, 3.0, n), 0, 23.99)
      return np.column_stack([density, distance])

  def bin_index(value, bins):
      for i, (lo, hi) in enumerate(bins):
          if lo <= value < hi:
              return i
      return len(bins) - 1
