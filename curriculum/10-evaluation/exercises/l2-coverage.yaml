tests: |
  import numpy as np
  _n = naive_suite()
  _g = coverage_grid(_n)
  assert _g.shape == (4, 4), "grid must be 4x4"
  assert _g.sum() == len(_n), "every scenario must land in exactly one cell"
  _cov_naive = coverage_fraction(_n)
  assert _cov_naive < 0.75, "the naive suite should have visible GAPS (got coverage %.2f) - normal draws starve the corners" % _cov_naive
  assert _g[0, 0] < 5, "the low-density/short-distance corner should be nearly empty in the naive suite"
  _s = stratified_suite()
  assert len(_s) >= 288, "stratified suite should produce ~n scenarios (got %d)" % len(_s)
  _gs = coverage_grid(_s)
  assert coverage_fraction(_s) == 1.0, "stratified suite must cover ALL 16 cells (got %.2f)" % coverage_fraction(_s)
  assert _gs.min() >= 5, "every cell needs at least 5 scenarios, weakest has %d" % _gs.min()
  assert _gs.max() - _gs.min() <= 2, "stratification means EQUAL cells - spread is %d" % (_gs.max() - _gs.min())
  _s2 = stratified_suite(seed=7)
  assert not np.allclose(_s, _s2), "different seeds must give different scenarios (equal coverage, not identical worlds)"
  assert coverage_fraction(_s2) == 1.0, "coverage must hold across seeds"
hints:
  - "coverage_grid: loop the suite, `g[bin_index(d, DENSITY_BINS), bin_index(x, DISTANCE_BINS)] += 1`."
  - "coverage_fraction: `float((coverage_grid(suite) >= min_per_cell).sum()) / 16`."
  - "stratified_suite: `per = n // 16`; for each (i, j) cell draw `per` samples with `rng.uniform(lo, hi)` from that cell's DENSITY_BINS[i] and DISTANCE_BINS[j] ranges; stack them all."
solution: |
  import numpy as np

  def coverage_grid(suite):
      g = np.zeros((4, 4), dtype=int)
      for d, x in suite:
          g[bin_index(d, DENSITY_BINS), bin_index(x, DISTANCE_BINS)] += 1
      return g

  def coverage_fraction(suite, min_per_cell=5):
      return float((coverage_grid(suite) >= min_per_cell).sum()) / 16.0

  def stratified_suite(n=300, seed=0):
      rng = np.random.default_rng(seed)
      per = n // 16
      out = []
      for i, (dlo, dhi) in enumerate(DENSITY_BINS):
          for j, (xlo, xhi) in enumerate(DISTANCE_BINS):
              out.append(np.column_stack([
                  rng.uniform(dlo, dhi, per),
                  rng.uniform(xlo, xhi, per),
              ]))
      return np.vstack(out)

  naive = naive_suite()
  strat = stratified_suite()
  print("naive coverage:      %.2f" % coverage_fraction(naive))
  print("stratified coverage: %.2f" % coverage_fraction(strat))
  print("naive grid:\n", coverage_grid(naive))
