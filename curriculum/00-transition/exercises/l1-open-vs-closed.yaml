id: ml0-open-vs-closed
title: "Open-loop vs closed-loop: feel the feedback"
lesson: modules/00-transition/01-what-changes
description: >-
  A robot tries to hold heading 0 while a constant disturbance (crosswind,
  miscalibrated wheel) pushes it off course. Implement both strategies:
  open-loop (replay the nominal command) and closed-loop (correct based on
  the measured heading). The tests check the punchline: open-loop error
  grows without bound; closed-loop error stays bounded — with the *same*
  disturbance.
setup_code: |
  import numpy as np

  DISTURBANCE = 0.05  # rad/s of constant unwanted turn

  def simulate(policy, steps=500, dt=0.1, seed=0):
      """policy(measured_heading) -> commanded turn rate. Returns |heading| history."""
      rng = np.random.default_rng(seed)
      theta, history = 0.0, []
      for _ in range(steps):
          measured = theta + rng.normal(0, 0.01)   # noisy compass
          u = policy(measured)
          theta = theta + (u + DISTURBANCE) * dt
          history.append(abs(theta))
      return np.array(history)
starter_code: |
  import numpy as np
  # Provided: simulate(policy) — runs 500 steps with a constant hidden
  # disturbance; policy sees a noisy heading measurement each step.

  def open_loop(measured_heading):
      """No feedback: command the nominal 'drive straight' turn rate."""
      # TODO: return the command that ignores the measurement entirely
      return 0.0

  def closed_loop(measured_heading, k=2.0):
      """Feedback: steer against the measured heading error (target = 0)."""
      # TODO: proportional correction toward heading 0
      return 0.0

  err_open = simulate(open_loop)
  err_closed = simulate(closed_loop)
  print("open-loop final error:  ", err_open[-1])
  print("closed-loop final error:", err_closed[-1])
tests: |
  import numpy as np
  _eo = simulate(open_loop)
  _ec = simulate(closed_loop)
  assert _eo[-1] > 1.0, "open-loop error should grow roughly linearly under constant disturbance (final |heading| was %.3f — did you add feedback by accident?)" % _eo[-1]
  assert _eo[-1] > _eo[len(_eo)//2] * 1.5, "open-loop error must keep GROWING through the run"
  assert _ec[-1] < 0.1, "closed-loop error must stay bounded (final |heading| %.3f) — steer proportionally AGAINST the measured heading" % _ec[-1]
  assert np.max(_ec[100:]) < 0.15, "closed-loop error must stay bounded for the whole run, not just at the end"
hints:
  - "Open-loop: the nominal command for driving straight is simply 0.0 — the point is that it cannot know about the disturbance."
  - "Closed-loop: error = 0 − measured_heading; return k * error, i.e. `-k * measured_heading`."
solution: |
  import numpy as np

  def open_loop(measured_heading):
      return 0.0

  def closed_loop(measured_heading, k=2.0):
      return -k * measured_heading

  err_open = simulate(open_loop)
  err_closed = simulate(closed_loop)
  print("open-loop final error:  ", err_open[-1])
  print("closed-loop final error:", err_closed[-1])
