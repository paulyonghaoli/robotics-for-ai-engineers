tests: |
  import numpy as np
  # All four are real incidents.
  for _n, _i in INCIDENTS.items():
      assert success_drop(_i) > 0.09, "incident %s should show a real success drop (got %.2f)" % (_n, success_drop(_i))
  # A: the pipeline started blowing its deadline; both versions hurt equally.
  assert latency_breached(INCIDENTS["A"]), "A's p99 crossed the 50 ms deadline"
  assert not version_correlated(INCIDENTS["A"]), "...and it hit both versions alike"
  assert diagnose(INCIDENTS["A"]) == "deadline-cascade"
  # B: only the new version degraded.
  assert not latency_breached(INCIDENTS["B"]), "B's latency is fine"
  assert version_correlated(INCIDENTS["B"]), "...but the drop lands entirely on v8"
  assert diagnose(INCIDENTS["B"]) == "bad-rollout"
  # C: the world changed - sensors and belief both moved, both versions hurt.
  assert belief_degraded(INCIDENTS["C"]), "C's NIS more than doubled"
  assert not version_correlated(INCIDENTS["C"]), "...affecting both versions"
  assert diagnose(INCIDENTS["C"]) == "environment-drift"
  # D: the hard one. Everything you measured looks normal.
  assert not latency_breached(INCIDENTS["D"]), "D's latency is fine"
  assert not version_correlated(INCIDENTS["D"]), "D hits both versions"
  assert not belief_degraded(INCIDENTS["D"]), "D's belief layer is healthy"
  assert diagnose(INCIDENTS["D"]) == "insufficient-telemetry", "D must be reported as unexplained - inventing a cause is worse than admitting the gap"
  # And the diagnoses must be distinct: one probe alone separates nothing.
  _labels = [diagnose(i) for i in INCIDENTS.values()]
  assert len(set(_labels)) == 4, "each incident should get its own diagnosis, got %s" % _labels
hints:
  - "success_drop: average `before - after` across the versions in success_by_version."
  - "latency_breached: `before <= DEADLINE_MS < after`."
  - "version_correlated: compute each version's drop, then check `max(drops) - min(drops) > gap`."
  - "belief_degraded: `after > factor * before` on mean_nis."
  - "diagnose: apply the three checks in order and fall through to 'insufficient-telemetry'. Incident D is the point of the exercise — every probe you have comes back clean while the robots genuinely got worse, and the correct output is that you cannot say, followed by adding the signal you wish you'd had."
solution: |
  import numpy as np

  def success_drop(inc):
      drops = [b - a for b, a in inc["success_by_version"].values()]
      return float(np.mean(drops))

  def latency_breached(inc):
      before, after = inc["latency_p99_ms"]
      return bool(before <= DEADLINE_MS < after)

  def version_correlated(inc, gap=0.1):
      drops = [b - a for b, a in inc["success_by_version"].values()]
      return bool(max(drops) - min(drops) > gap)

  def belief_degraded(inc, factor=1.5):
      before, after = inc["mean_nis"]
      return bool(after > factor * before)

  def diagnose(inc):
      if latency_breached(inc):
          return "deadline-cascade"
      if version_correlated(inc):
          return "bad-rollout"
      if belief_degraded(inc):
          return "environment-drift"
      return "insufficient-telemetry"

  for name, inc in INCIDENTS.items():
      print("%s | drop %.2f  latency_breach=%-5s version_corr=%-5s nis_up=%-5s -> %s" % (
          name, success_drop(inc), latency_breached(inc),
          version_correlated(inc), belief_degraded(inc), diagnose(inc)))
