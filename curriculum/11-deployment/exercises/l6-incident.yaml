id: dep-l6-incident
title: "Four incidents, one on-call shift"
lesson: modules/11-deployment/06-lab-the-incident
description: >-
  Four fleet incidents. Success rate dropped in every one, and that is the
  only thing they have in common. Build the probes that separate a
  deadline cascade from a bad rollout from environmental drift — and
  recognize the fourth case, where the honest answer is that your
  telemetry cannot say.
setup_code: |
  # Each incident: metrics from the week BEFORE and the week AFTER it began.
  # success_by_version splits the fleet by software version.
  INCIDENTS = {
      "A": {
          "latency_p99_ms": (38.0, 71.0),
          "sensor_mean_range_m": (4.02, 4.01),
          "mean_nis": (1.03, 1.05),
          "success_by_version": {"v7": (0.95, 0.79), "v8": (0.95, 0.78)},
      },
      "B": {
          "latency_p99_ms": (39.0, 40.0),
          "sensor_mean_range_m": (4.00, 3.99),
          "mean_nis": (1.01, 1.02),
          "success_by_version": {"v7": (0.95, 0.95), "v8": (0.94, 0.71)},
      },
      "C": {
          "latency_p99_ms": (38.5, 39.5),
          "sensor_mean_range_m": (4.01, 4.62),
          "mean_nis": (1.02, 2.41),
          "success_by_version": {"v7": (0.95, 0.82), "v8": (0.95, 0.81)},
      },
      "D": {
          "latency_p99_ms": (38.0, 38.6),
          "sensor_mean_range_m": (4.00, 4.02),
          "mean_nis": (1.02, 1.04),
          "success_by_version": {"v7": (0.95, 0.83), "v8": (0.95, 0.84)},
      },
  }

  DEADLINE_MS = 50.0
