id: dep-l5-safety-monitor
title: "Make an unsafe policy safe without making it useless"
lesson: modules/11-deployment/05-safety-cases
description: >-
  A learned policy that is sensible 97% of the time and occasionally
  proposes something reckless. You cannot prove anything about the policy
  — but you can prove things about a simple monitor wrapped around it.
  Build the monitor, then find the margin where the system is both safe
  and still able to do its job.
setup_code: |
  import numpy as np

  DT, A_MAX = 0.1, 2.0          # timestep, braking authority (m/s^2)
  START_DISTANCE = 6.0
  GOAL_DISTANCE = 0.5           # the task: stop within this of the wall

  def learned_policy(d, v, rng, reckless_rate=0.03):
      """Mostly sensible, occasionally proposes a dangerous acceleration.
      You cannot inspect or verify it — treat it as a black box."""
      a = 1.6 * (d - 0.4) - 1.9 * v
      if rng.random() < reckless_rate:
          a = abs(a) + 3.0
      return float(np.clip(a, -A_MAX, A_MAX))
