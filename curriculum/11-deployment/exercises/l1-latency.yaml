id: dep-l1-latency
title: "Find the stage that's actually blowing your deadline"
lesson: modules/11-deployment/01-latency-budgets
description: >-
  Four pipeline stages and a 50 ms control period. One stage has by far
  the largest mean latency. A different one causes almost all the deadline
  misses. Build the budget analysis that tells them apart, then confirm
  which stage is worth optimizing.
setup_code: |
  import numpy as np

  DEADLINE_MS = 50.0
  _rng = np.random.default_rng(0)
  _N = 20000

  # Measured latencies per stage, in milliseconds, under realistic load.
  STAGES = {
      "perception": _rng.gamma(9, 1.6, _N),
      "estimation": _rng.gamma(4, 0.8, _N),
      # Planning is usually cheap but occasionally does a full replan.
      "planning": np.where(_rng.random(_N) < 0.06,
                           _rng.gamma(9, 4.0, _N),
                           _rng.gamma(3, 1.0, _N)),
      "control": _rng.gamma(3, 0.7, _N),
  }
