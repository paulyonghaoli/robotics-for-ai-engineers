id: dep-l3-canary
title: "How big does the canary need to be?"
lesson: modules/11-deployment/03-rollout-rollback
description: >-
  "We ran it overnight on one robot and it looked fine." Work out what
  that sentence is actually worth. Build the canary's hypothesis test,
  compute its power against regressions of different sizes, and derive
  the episode count you'd need to defend a promotion.
setup_code: |
  from math import comb

  BASELINE = 0.02        # current fleet failure rate

  def binom_cdf(k, n, p):
      """P(X <= k) for X ~ Binomial(n, p)."""
      if k < 0:
          return 0.0
      k = min(k, n)
      return sum(comb(n, i) * p**i * (1 - p) ** (n - i) for i in range(k + 1))
