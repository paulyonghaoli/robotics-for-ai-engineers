id: dep-l4-telemetry
title: "Budget the telemetry, then survive an incident spike"
lesson: modules/11-deployment/04-telemetry-forensics
description: >-
  You cannot upload everything a robot produces, and the streams you'd
  need to diagnose an incident are exactly the expensive ones. Size a
  ring-buffer-plus-trigger scheme against a real uplink budget — then
  discover that its bandwidth scales with the incident rate, so it breaks
  precisely when things start going wrong.
setup_code: |
  # Per-robot data rates, MB/s, and whether the stream is needed to
  # reconstruct what happened during an incident.
  STREAMS = {
      "camera":      {"mb_per_s": 25.0, "needed_for_diagnosis": True},
      "lidar":       {"mb_per_s":  8.0, "needed_for_diagnosis": True},
      "diagnostics": {"mb_per_s":  0.10, "needed_for_diagnosis": True},
      "pose":        {"mb_per_s":  0.04, "needed_for_diagnosis": True},
      "imu":         {"mb_per_s":  0.02, "needed_for_diagnosis": False},
  }

  UPLINK_BUDGET_MB_S = 2.0     # per robot, sustained
  BUFFER_SECONDS = 30.0        # ring buffer captured around each incident
  NOMINAL_INCIDENTS_PER_HOUR = 3.0
